  function notificationPermission(){try{return 'Notification' in window?Notification.permission:'unsupported'}catch(e){return 'unsupported'}}
  window.spRequestMerchantBrowserNotifications=function(){
    try{
      if(!('Notification' in window)){if(typeof toast==='function')toast('Браузер не поддерживает системные уведомления');return Promise.resolve('unsupported')}
      if(Notification.permission==='granted'){if(typeof toast==='function')toast('Всплывающие уведомления уже включены');augmentCenter();return Promise.resolve('granted')}
      if(Notification.permission==='denied'){if(typeof toast==='function')toast('Уведомления заблокированы. Разрешите их в настройках сайта браузера.');augmentCenter();return Promise.resolve('denied')}
      return Notification.requestPermission().then(function(p){
        if(typeof toast==='function')toast(p==='granted'?'Всплывающие уведомления включены':'Уведомления не разрешены');
        augmentCenter();
        return p;
      });
    }catch(e){if(typeof toast==='function')toast('Не удалось включить уведомления');return Promise.resolve('error')}
  };

  function merchantPrefKey(event){return event&&event.type==='status'?'merchantStatusChanged':'merchantCreated'}
  function merchantEventAllowed(event){try{return typeof spNotificationPreferenceEnabled==='function'?spNotificationPreferenceEnabled(merchantPrefKey(event),'browser'):true}catch(e){return true}}
  function nativeNotify(event){
    try{
      if(!merchantEventAllowed(event))return;
      if(!('Notification' in window)||Notification.permission!=='granted')return;

        ? 'Мерчант: '+event.name+'\nМенеджер: '+(event.manager||'не указан')+'\nСтатус: '+statusText(event.newStatus)
        : 'Мерчант: '+event.name+'\n'+statusText(event.oldStatus)+' → '+statusText(event.newStatus);
      var prefs=typeof spGetNotificationPreferences==='function'?spGetNotificationPreferences():{};
      var n=new Notification(title,{body:body,tag:event.id,silent:!prefs.soundEnabled,icon:'icon-192.png'});
      n.onclick=function(){try{n.close()}catch(e){}openMerchant(event.merchantId)};
    }catch(e){}
  }

  function showToast(event){
    if(!merchantEventAllowed(event))return;
    var wrap=document.getElementById('taskToastWrap');
    if(!wrap){wrap=document.createElement('div');wrap.id='taskToastWrap';wrap.className='task-toast-wrap';document.body.appendChild(wrap)}
    var el=document.createElement('div');
    el.className='task-toast sp-merchant-event-toast '+(event.type==='status'?'is-status':'');
    var permission=notificationPermission();
    var title=event.type==='new'?'🆕 Новый мерчант':'🔄 Статус мерчанта изменён';
    var body=event.type==='new'
      ? 'Мерчант: <b>'+escHtml(event.name)+'</b><br>Менеджер: '+escHtml(event.manager||'не указан')+'<br>Статус: '+escHtml(statusText(event.newStatus))
      : 'Мерчант: <b>'+escHtml(event.name)+'</b><br>'+escHtml(statusText(event.oldStatus))+' → <b>'+escHtml(statusText(event.newStatus))+'</b>';
    var permissionBtn=permission==='default'?'<button type="button" data-mb-enable>🔔 Включить на мониторе</button>':'';
    el.innerHTML='<div class="sp-mb-title">'+title+'</div><div class="sp-mb-body">'+body+'</div><div class="sp-mb-actions"><button type="button" data-mb-open>Открыть карточку</button>'+permissionBtn+'<button type="button" class="secondary" data-mb-close>Закрыть</button></div>';
    el.querySelector('[data-mb-open]').onclick=function(){el.remove();openMerchant(event.merchantId)};
    var enable=el.querySelector('[data-mb-enable]');if(enable)enable.onclick=function(){window.spRequestMerchantBrowserNotifications()};
    el.querySelector('[data-mb-close]').onclick=function(){el.remove()};
    wrap.appendChild(el);
    setTimeout(function(){if(el&&el.parentNode)el.remove()},15000);
  }

  function emit(event){if(!merchantEventAllowed(event))return;showToast(event);nativeNotify(event)}

  function checkMerchants(){
    try{
      if(!window.state||!Array.isArray(state.merchants)||!current())return;
      var currentMap=snapshotOf(state.merchants);
      var oldMap=readJson(snapshotKey(),null);
      if(!oldMap){saveJson(snapshotKey(),currentMap);return}
      var seen=seenSet(), changed=false;
      Object.keys(currentMap).forEach(function(key){
        var now=currentMap[key], old=oldMap[key];
        var merchant=(state.merchants||[]).find(function(m){return merchantKey(m)===key});
        if(!merchant||!managerMatches(merchant))return;
        if(!old){
          var newId='merchant-new-'+key+'-'+(now.updatedAt||Date.now());
          if(!seen.has(newId)){seen.add(newId);changed=true;emit({id:newId,type:'new',merchantId:now.id,name:now.name,manager:now.manager,newStatus:now.status})}
        }else if(norm(old.status)!==norm(now.status)){
          var statusId='merchant-status-'+key+'-'+norm(old.status)+'-'+norm(now.status)+'-'+(now.updatedAt||Date.now());
          if(!seen.has(statusId)){seen.add(statusId);changed=true;emit({id:statusId,type:'status',merchantId:now.id,name:now.name,manager:now.manager,oldStatus:old.status,newStatus:now.status})}
        }
      });
      saveJson(snapshotKey(),currentMap);
      if(changed)saveSeen(seen);

  }
  window.spCheckMerchantBrowserNotifications=checkMerchants;

  function augmentCenter(){
    var actions=document.querySelector('#spNotifyPanel .sp-notify-actions');
    if(!actions)return;

    if(btn)btn.remove();
  }

  function permissionPrompt(){
    try{
      if(!('Notification' in window)||Notification.permission!=='default'||!current())return;

      if(last&&Date.now()-last<week)return;

      var wrap=document.getElementById('taskToastWrap');
      if(!wrap){wrap=document.createElement('div');wrap.id='taskToastWrap';wrap.className='task-toast-wrap';document.body.appendChild(wrap)}
      var el=document.createElement('div');el.className='task-toast sp-merchant-event-toast is-permission';
      el.innerHTML='<div class="sp-mb-title">🔔 Включите всплывающие уведомления</div><div class="sp-mb-body">Тогда новые мерчанты и изменения статусов будут появляться на мониторе, даже когда открыта другая вкладка.</div><div class="sp-mb-actions"><button type="button" data-mb-enable>Включить</button><button type="button" class="secondary" data-mb-close>Позже</button></div>';
      el.querySelector('[data-mb-enable]').onclick=function(){window.spRequestMerchantBrowserNotifications().then(function(p){if(p==='granted')el.remove()})};
      el.querySelector('[data-mb-close]').onclick=function(){el.remove()};wrap.appendChild(el);
      setTimeout(function(){if(el&&el.parentNode)el.remove()},18000);
    }catch(e){}
  }

  try{
    var oldNotify=window.notifyAssignedTasks;
    if(typeof oldNotify==='function'&&!oldNotify.__spMbWrapped){
      var wrapped=function(){var r=oldNotify.apply(this,arguments);setTimeout(checkMerchants,100);setTimeout(augmentCenter,160);return r};
      wrapped.__spMbWrapped=true;window.notifyAssignedTasks=wrapped;
    }
  }catch(e){}

  var spMbAugmentTimer=null;
  function scheduleAugmentCenter(){
    if(spMbAugmentTimer)clearTimeout(spMbAugmentTimer);
    spMbAugmentTimer=setTimeout(function(){spMbAugmentTimer=null;augmentCenter()},100);
  }
  var observer=new MutationObserver(function(mutations){
    var panel=document.getElementById('spNotifyPanel');
    if(!panel)return;
    for(var i=0;i<mutations.length;i++){
      var target=mutations[i]&&mutations[i].target;
      if(target===panel || (target&&panel.contains(target)) || (mutations[i].addedNodes&&mutations[i].addedNodes.length)){
        scheduleAugmentCenter();
        break;
      }

  });

    try{observer.observe(document.body,{childList:true,subtree:true})}catch(e){}
    setTimeout(checkMerchants,1000);setTimeout(scheduleAugmentCenter,1100);setTimeout(permissionPrompt,1800);
  });
  setTimeout(checkMerchants,1200);setTimeout(scheduleAugmentCenter,1300);setTimeout(permissionPrompt,2200);
  try{
    var oldOpenCenter=window.spNcOpenNotificationCenter;
    if(typeof oldOpenCenter==='function'&&!oldOpenCenter.__spMbFreezeFix){

        return result;
      };
      fixedOpenCenter.__spMbFreezeFix=true;
      window.spNcOpenNotificationCenter=fixedOpenCenter;
    }
  }catch(e){}
  try{if(window.CONFIG)CONFIG.APP_VERSION='v3.10.66-merchant-product-comment-tooltips'}catch(e){}
})();

<script id="sp-action-tooltip-safe-v31070-script">
(function(){

  var active=null;
  var hideTimer=null;

  function tooltip(){
    if(tip && document.body.contains(tip)) return tip;
    tip=document.createElement('div');
    tip.id='spActionTooltipV31070';
    tip.setAttribute('role','tooltip');
    document.body.appendChild(tip);
    return tip;
  }

  function targetFrom(node){
    if(!node || !node.closest) return null;
    return node.closest('.merchant-table-wrap .btn.icon[data-tip]');
  }

  function hideNow(){
    active=null;
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}
    if(!tip) return;
    tip.classList.remove('show','below');
    tip.style.display='none';
  }

  function hideSoon(){
    active=null;
    if(hideTimer) clearTimeout(hideTimer);
    hideTimer=setTimeout(hideNow,90);
  }

  function showFor(btn){
    var label=String(btn.getAttribute('data-tip')||btn.getAttribute('aria-label')||'').trim();
    if(!label) return;
    if(hideTimer){clearTimeout(hideTimer);hideTimer=null;}

    var el=tooltip();
    el.textContent=label;
    el.classList.remove('show','below');
