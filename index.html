/* === v1.6 table sticky + empty states + activity badge fix === */

/* Correct sticky table header */
.table-wrap,
.table-scroll,
.panel:has(table){
  overflow:auto!important;
  max-height:none;
}
.table-wrap table,
.table-scroll table,
.panel table{
  border-collapse:separate!important;
  border-spacing:0!important;
}
.table-wrap thead th,
.table-scroll thead th,
.panel table thead th{
  position:sticky!important;
  top:0!important;
  z-index:20!important;
  background:#f8fbff!important;
  box-shadow:0 1px 0 #dbe6f7, 0 8px 18px rgba(15,23,42,.05)!important;
}
html[data-theme="dark"] .table-wrap thead th,
html[data-theme="dark"] .table-scroll thead th,
html[data-theme="dark"] .panel table thead th{
  background:#101b2e!important;
  box-shadow:0 1px 0 #263a5c, 0 8px 18px rgba(0,0,0,.22)!important;
}

/* Beautiful empty states */
.empty-state{
  padding:44px 20px!important;
  text-align:center!important;
  color:#64748b!important;
}
.empty-state .empty-icon{
  width:60px;
  height:60px;
  margin:0 auto 12px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#eef4ff,#f8fbff);
  border:1px solid #dbe6f7;
  font-size:28px;
}
.empty-state h3{
  margin:0 0 6px;
  color:#172033;
  font-size:18px;
  font-weight:1000;
}
.empty-state p{
  margin:0;
  line-height:1.5;
  font-size:13px;
  color:#64748b;
}
html[data-theme="dark"] .empty-state .empty-icon{
  background:linear-gradient(135deg,#17243a,#0b1324);
  border-color:#2a3853;
}
html[data-theme="dark"] .empty-state h3{
  color:#fff;
}
html[data-theme="dark"] .empty-state p{
  color:#cbd5e1;
}

/* === v3.9.3 — Typography clarity and strict theme contrast === */
:root{
  --ios-font:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Roboto,Arial,sans-serif;
  --ios-text:#101827;
  --ios-muted:#526176;
}
html,body,button,input,select,textarea{
  font-family:var(--ios-font)!important;
  font-synthesis:none;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body{font-size:14px;line-height:1.42}
body,body *{text-shadow:none!important}

/* Avoid synthetic fractional font weights that look fuzzy in Windows browsers. */
body{font-weight:400}
strong,b,.manager,.merchant-name-main,.contract b,.user-meta b,.bar-label,.funnel-stage-name,.funnel-stage-metric b{font-weight:700!important}
h1,h2,h3,h4,h5,.top h2,.panel-head h3,.card .num,.kpi b{font-weight:700!important}
.nav button,.btn,.tab-btn,.sort-pill,.lang-seg-btn,.action-link,.field label,.sort-label,.status,.priority-high,.priority-mid,.priority-low{font-weight:600!important}
th{font-weight:700!important}

/* Keep glass on the shell, but make text-heavy surfaces opaque enough for crisp rendering. */
.panel,.metric-panel,.profile-head,.profile-block,.info-tile,.guide-card,.comparison-item,.partner-card,.partner-summary-card{
  background:rgba(255,255,255,.94)!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
.card,.kpi,.check-card,.funnel-stage-card{
  background:rgba(255,255,255,.90)!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
.panel-head,.tabs,.nice-tabs{
  background:#f8faff!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
.table-wrap{background:#fff!important}
table{font-size:13.5px;line-height:1.4}
th{
  color:#4a5a70!important;
  background:#f5f7fb!important;
  font-size:11.5px!important;
  letter-spacing:.025em!important;
}
td{
  color:#172033!important;
  background:#fff!important;
  font-size:13px!important;
  font-weight:400!important;
}
tr:hover td{background:#f2f7ff!important}
.row-high td,.task-high td{background:#fff4f4!important}
.row-mid td,.task-mid td{background:#fff9e9!important}
.task-closed td{background:#f4f6f9!important;color:#5f6c80!important}

/* Stronger hierarchy and readable secondary text. */
.top h2{color:#0b1220!important;letter-spacing:-.45px!important}
.top small,.card .label,.comment,.task-comment,.profile-title .sub,.info-tile span,.profile-block span,.muted-small,.contract small,.chart-note,.bar-value,.sort-note,.guide-card p,.user-meta small{
  color:#526176!important;
  opacity:1!important;
}
.linklike,.merchant-name-main,.contract b,.contract-number,.contact-phone-text,.profile-title h3,.info-tile b,.profile-block p,.funnel-stage-name,.funnel-stage-metric b{color:#111827!important}
.contract-link,.contact-link,.doc-link,.chart-note button{color:#075ecf!important}
.nav button{font-size:14px!important}
.app-version{font-weight:600!important}

/* Controls should remain sharp and never inherit the wrong theme text color. */
.btn,.pill,.user-chip,.lang-segment,.help-btn,.theme-toggle,.sort-pill,.tab-btn,.nice-tabs .tab-btn{
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
  background:#fff!important;
  color:#111827!important;
  -webkit-text-fill-color:#111827!important;
  font-weight:400!important;
}
input::placeholder,textarea::placeholder{color:#6f7d90!important;-webkit-text-fill-color:#6f7d90!important}

/* Dark theme: solid surfaces and higher contrast instead of gray translucent rows. */
html[data-theme="dark"]{
  --ios-text:#f4f7fc;
  --ios-muted:#a9b6c9;
}
html[data-theme="dark"] .panel,
html[data-theme="dark"] .metric-panel,
html[data-theme="dark"] .profile-head,
html[data-theme="dark"] .profile-block,
html[data-theme="dark"] .info-tile,
html[data-theme="dark"] .guide-card,
html[data-theme="dark"] .comparison-item,
html[data-theme="dark"] .partner-card,
html[data-theme="dark"] .partner-summary-card{
  background:#111a2a!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
html[data-theme="dark"] .card,
html[data-theme="dark"] .kpi,
html[data-theme="dark"] .check-card,
html[data-theme="dark"] .funnel-stage-card{
  background:#131d2f!important;
  -webkit-backdrop-filter:none!important;
  backdrop-filter:none!important;
}
html[data-theme="dark"] .panel-head,
html[data-theme="dark"] .tabs,
html[data-theme="dark"] .nice-tabs{background:#0e1728!important}
html[data-theme="dark"] .table-wrap{background:#0d1524!important}
html[data-theme="dark"] th{
  color:#b8c5d8!important;
  background:#0b1322!important;
}
html[data-theme="dark"] td{
  color:#f0f4fa!important;
  background:#121b2c!important;
  border-color:#27344a!important;
}
html[data-theme="dark"] tr:hover td{background:#1a2941!important}
html[data-theme="dark"] .row-high td,
html[data-theme="dark"] .task-high td{background:#321c26!important}
html[data-theme="dark"] .row-mid td,
html[data-theme="dark"] .task-mid td{background:#302718!important}
html[data-theme="dark"] .task-closed td{background:#101827!important;color:#9ca9bc!important}
html[data-theme="dark"] .top h2,
html[data-theme="dark"] .linklike,
html[data-theme="dark"] .merchant-name-main,
html[data-theme="dark"] .contract b,
html[data-theme="dark"] .contract-number,
html[data-theme="dark"] .contact-phone-text,
html[data-theme="dark"] .profile-title h3,
html[data-theme="dark"] .info-tile b,
html[data-theme="dark"] .profile-block p,
html[data-theme="dark"] .funnel-stage-name,
html[data-theme="dark"] .funnel-stage-metric b{color:#f4f7fc!important}
html[data-theme="dark"] .top small,
html[data-theme="dark"] .card .label,
html[data-theme="dark"] .comment,
html[data-theme="dark"] .task-comment,
html[data-theme="dark"] .profile-title .sub,
html[data-theme="dark"] .info-tile span,
html[data-theme="dark"] .profile-block span,
html[data-theme="dark"] .muted-small,
html[data-theme="dark"] .contract small,
html[data-theme="dark"] .chart-note,
html[data-theme="dark"] .bar-value,
html[data-theme="dark"] .sort-note,
html[data-theme="dark"] .guide-card p,
html[data-theme="dark"] .user-meta small{color:#a9b6c9!important;opacity:1!important}
html[data-theme="dark"] input,
html[data-theme="dark"] select,
html[data-theme="dark"] textarea,
html[data-theme="dark"] .field input,
html[data-theme="dark"] .field select,
html[data-theme="dark"] .field textarea,
html[data-theme="dark"] .filters input,
html[data-theme="dark"] .filters select,
  background:#0b1322!important;
  color:#f4f7fc!important;
  -webkit-text-fill-color:#f4f7fc!important;
}
html[data-theme="dark"] input::placeholder,
html[data-theme="dark"] textarea::placeholder{color:#8f9db1!important;-webkit-text-fill-color:#8f9db1!important}

@media(max-width:900px){
  body{font-size:14px}
  table{font-size:13px}
  td{font-size:13px!important}
  .nav button span[data-i18n]{font-weight:600!important}
}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

/* === v3.9.3 — iPhone bottom navigation hard fix === */
@media (max-width:900px){
  html,body{min-height:100%;}
  body:not(.login-open){padding-bottom:calc(96px + env(safe-area-inset-bottom))!important;}
  .app{display:block!important;transform:none!important;filter:none!important;perspective:none!important;contain:none!important;}
  .main{padding-bottom:calc(118px + env(safe-area-inset-bottom))!important;}
  body > .sidebar,
  .app > .sidebar{
    position:fixed!important;
    inset:auto 8px calc(8px + env(safe-area-inset-bottom)) 8px!important;
    top:auto!important;
    bottom:calc(8px + env(safe-area-inset-bottom))!important;
    left:8px!important;
    right:8px!important;
    width:auto!important;
    height:auto!important;
    min-height:0!important;
    max-height:none!important;
    margin:0!important;
    padding:7px 8px!important;
    z-index:2400!important;
    overflow:visible!important;
    border-radius:25px!important;
    transform:translate3d(0,0,0)!important;
    -webkit-transform:translate3d(0,0,0)!important;
    will-change:transform;
    background:rgba(10,25,48,.88)!important;
    border:1px solid rgba(255,255,255,.16)!important;
    -webkit-backdrop-filter:blur(28px) saturate(180%)!important;
    backdrop-filter:blur(28px) saturate(180%)!important;
    box-shadow:0 16px 42px rgba(4,12,26,.38),inset 0 1px 0 rgba(255,255,255,.15)!important;
  }
  body.login-open > .sidebar,body.login-open .app > .sidebar{display:none!important;}
  .sidebar .brand,.sidebar .app-version,.sidebar::before{display:none!important;}
  .sidebar .nav{
    width:100%!important;
    display:grid!important;
    grid-template-columns:repeat(5,minmax(0,1fr))!important;
    gap:4px!important;
    margin:0!important;
  }
  .sidebar .nav button{
    min-width:0!important;
    min-height:58px!important;
    padding:7px 2px!important;
    border-radius:18px!important;
    display:flex!important;
    flex-direction:column!important;
    align-items:center!important;
    justify-content:center!important;
    gap:4px!important;
    font-size:19px!important;
    line-height:1!important;
    white-space:nowrap!important;
  }
  .sidebar .nav button span[data-i18n]{
    display:block!important;
    max-width:100%!important;
    overflow:hidden!important;
    text-overflow:ellipsis!important;
    font-size:10px!important;
    line-height:1.1!important;
  }
  .toast,.task-toast-wrap{bottom:calc(96px + env(safe-area-inset-bottom))!important;}
}
@media (max-width:430px){
  body > .sidebar,.app > .sidebar{left:6px!important;right:6px!important;bottom:calc(6px + env(safe-area-inset-bottom))!important;}
  .sidebar .nav button{min-height:56px!important;font-size:18px!important;}
  .sidebar .nav button span[data-i18n]{font-size:9.5px!important;}
}

</style>

/* v3.9.3: detach the mobile tab bar from the app grid so iOS always pins it to the viewport. */
(function(){
  var mq=window.matchMedia ? window.matchMedia('(max-width:900px)') : null;
  var sidebar=null, app=null, marker=null;
  function syncMobileTabBar(){
    sidebar=sidebar||document.querySelector('.sidebar');
    app=app||document.querySelector('.app');
    if(!sidebar||!app) return;
    var mobile=mq ? mq.matches : window.innerWidth<=900;
    if(mobile){
      if(sidebar.parentNode!==document.body){
        marker=document.createComment('smartpay-sidebar-home');
        sidebar.parentNode.insertBefore(marker,sidebar);
        document.body.appendChild(sidebar);
      }
    }else if(sidebar.parentNode===document.body){
      if(marker&&marker.parentNode){marker.parentNode.insertBefore(sidebar,marker);marker.parentNode.removeChild(marker);}
      else app.insertBefore(sidebar,app.firstChild);
      marker=null;
    }
  }
  document.addEventListener('DOMContentLoaded',syncMobileTabBar);
  window.addEventListener('resize',syncMobileTabBar,{passive:true});
  window.addEventListener('orientationchange',function(){setTimeout(syncMobileTabBar,80);},{passive:true});
  if(mq){try{mq.addEventListener('change',syncMobileTabBar)}catch(e){try{mq.addListener(syncMobileTabBar)}catch(_){}}}
  setTimeout(syncMobileTabBar,0);
  setTimeout(syncMobileTabBar,300);
})();
</script>

ingsFull:"Раздел «Настройки» позволяет администратору управлять справочниками: пользователи, менеджеры, города, типы бизнеса, статусы, приоритеты, причины задержки и Telegram-настройки.",guideLanguagesFull:"Кнопка языка переключает интерфейс между русским и таджикским языками. При переключении меняются названия вкладок, кнопки, таблицы, статусы, фильтры, сообщения и инструкция.",guideVersionTitle:"Что нового в версии 1.7",guideVersionText:"Исправлено отображение просроченных задач, удален дублирующий счетчик на дашборде, исправлен переход к архивным задачам из блока «Сегодня», добавлены красивые сообщения при отсутствии данных, уменьшен переключатель языка, расширена инструкция и улучшена фиксация пользователя в истории действий."

function tr(v){
  const s=String(v??"").trim();
  if(state.lang!=="tj" || !s) return s;
  if(TJ_EXACT[s]) return TJ_EXACT[s];
  let out=s;
  Object.keys(TJ_WORDS).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.replaceAll(k,TJ_WORDS[k]);});
  return out;
}
function qs(s){return document.querySelector(s)}
function qsa(s){return [...document.querySelectorAll(s)]}
function applyTheme(themeValue){
  const theme = (themeValue || state.theme || localStorage.getItem("sp_theme") || "light") === "dark" ? "dark" : "light";
  state.theme = theme;
  try{ window.state = state; }catch(e){}
  try{ localStorage.setItem("sp_theme", theme); }catch(e){}
  document.documentElement.setAttribute("data-theme", theme);
  if(document.body){
    document.body.setAttribute("data-theme", theme);
    document.body.classList.toggle("dark-theme", theme === "dark");
  }
  document.documentElement.classList.toggle("dark-theme", theme === "dark");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", theme === "dark" ? "#070d18" : "#246bfe");
  const btn = document.getElementById("themeToggle");
  if(btn){
    btn.textContent = theme === "dark" ? "☀️" : "🌙";
    btn.title = theme === "dark" ? "Светлая тема" : "Тёмная тема";
    btn.setAttribute("aria-label", btn.title);
  }
  document.querySelectorAll('#personalUiSettings .sp-settings-option').forEach(b=>{
    const txt=String(b.textContent||'').toLowerCase();
    if(txt.includes('свет') || txt.includes('равшан')) b.classList.toggle('active', theme !== 'dark');
    if(txt.includes('тём') || txt.includes('торик')) b.classList.toggle('active', theme === 'dark');
  });
}
function toggleTheme(){
  const current = (state.theme || localStorage.getItem("sp_theme") || "light") === "dark" ? "dark" : "light";
  applyTheme(current === "dark" ? "light" : "dark");
}
function showLoader(v){qs("#loader").classList.toggle("show",!!v)}
function setButtonLoading(btn,on,text){
  if(!btn) return;
  if(on){
    btn.dataset.oldText=btn.innerHTML;
    btn.classList.add("loading");
    btn.disabled=true;
    if(text) btn.innerHTML=esc(text);
  }else{
    btn.classList.remove("loading");
    btn.disabled=false;
    if(btn.dataset.oldText){btn.innerHTML=btn.dataset.oldText;delete btn.dataset.oldText;}
  }
}

function fmtDate(v){
  if(!v) return "";
  const s=String(v).trim();
  // Без new Date(): дата должна показываться ровно так, как указана в Google Sheets.
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[3]}.${m[2]}.${m[1]}`;
  m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/);
  if(m) return `${m[1].padStart(2,"0")}.${m[2].padStart(2,"0")}.${m[3]}`;

  return s.replace(/\sGMT.*$/," ").replace(/T.*$/," ").trim();
}

function dateInputValue(v){

async function api(action,payload={}){
  if(!CONFIG.API_URL){
    if(CONFIG.DEMO_IF_NO_API) return demo;
    throw new Error("API_URL пустой");
  }
  const u=currentUser?.()||null;
  const auth=u?{login:u.login||"",fio:u.fio||"",accessLevel:u.accessLevel||"",position:u.position||""}:{};
  const res = await fetch(CONFIG.API_URL, {
    method:"POST",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({action,auth,...payload})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.message || "Ошибка API");
  return data;
}

function normalizeMerchantStatus(value){
  return String(value||"").trim().toLowerCase().replace(/\s+/g," ");
}
function merchantMatchesStatusFilter(merchant, filter){
  const wanted=normalizeMerchantStatus(filter);
  if(!wanted) return true;
  const actual=normalizeMerchantStatus(merchant?.status);
  const exactGroups={
    "активный":["активный","фаъол"],
    "в процессе":["в процессе","дар раванд"],
    "на интеграции и тест":["на интеграции и тест","дар ҳамгироӣ ва санҷиш"]
  };
  const aliases=exactGroups[wanted];
  return aliases ? aliases.includes(actual) : actual.includes(wanted);
}

const MERCHANT_FUNNEL_STAGES=[
  {key:'process',ru:'В процессе',tj:'Дар раванд',icon:'⚙️'},
  {key:'contract',ru:'Договор',tj:'Шартнома',icon:'📄'},
  {key:'integration',ru:'Интеграция',tj:'Ҳамгироӣ',icon:'🔗'},
  {key:'test',ru:'Тест',tj:'Санҷиш',icon:'🧪'},
  {key:'active',ru:'Активный',tj:'Фаъол',icon:'✅'}
];
function funnelStageLabel(key){const x=MERCHANT_FUNNEL_STAGES.find(s=>s.key===key);return x?(state.lang==='tj'?x.tj:x.ru):key}
function funnelStageIndex(key){return MERCHANT_FUNNEL_STAGES.findIndex(s=>s.key===key)}
function merchantFunnelStage(m){
  const stored=String(m?.funnelStage||'').trim().toLowerCase();
  if(MERCHANT_FUNNEL_STAGES.some(x=>x.key===stored))return stored;
  const status=String(m?.status||'').trim().toLowerCase().replace(/\s+/g,' ');
  if(status.includes('актив')||status.includes('фаъол'))return'active';
  if(status==='на интеграции и тест'||status==='дар ҳамгироӣ ва санҷиш')return'integration';
  if(status.includes('тест')||status.includes('санҷ'))return'test';
  if(status.includes('интеграц')||status.includes('ҳамгир'))return'integration';
  if(status.includes('договор')||status.includes('шартнома')||m?.contractNumber||m?.contractDate)return'contract';
  if(!status||status.includes('потенциал')||status==='новый'||status==='нав'||status.includes('нет ответа')||status.includes('ҷавоб нест'))return'potential';
  return'process';
}
function merchantStageDays(m){
  const raw=m?.stageEnteredAt||(merchantFunnelStage(m)==='contract'?m?.contractDate:'')||m?.createdAt||m?.updatedAt;
  const d=parseActivityDate(raw);if(!d||isNaN(d))return 0;
  return Math.max(0,Math.floor((Date.now()-d.getTime())/86400000));
}
function merchantFunnelMetrics(){
  const stages=MERCHANT_FUNNEL_STAGES.map(stage=>{
    const current=state.merchants.filter(m=>merchantFunnelStage(m)===stage.key);
    const idx=funnelStageIndex(stage.key);
    const passed=state.merchants.filter(m=>funnelStageIndex(merchantFunnelStage(m))>idx).length;
    const avg=current.length?Math.round(current.reduce((sum,m)=>sum+merchantStageDays(m),0)/current.length):0;
    const reached=current.length+passed;
    const conversion=reached?Math.round((passed/reached)*100):0;
    return {...stage,count:current.length,avgDays:avg,passed,conversion};
  });
  const candidates=stages.filter(x=>x.key!=='active'&&x.count>0).sort((a,b)=>b.count-a.count||b.avgDays-a.avgDays);
  return{stages,bottleneck:candidates[0]||null};
}

function parseDateOnly(v){const s=String(v||"").trim();if(!s)return null;let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);if(m)return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));return null}
function ymd(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function taskDueBucket(task){const d=parseDateOnly(task.dueDate);if(!d)return "noDate";const today=new Date();today.setHours(0,0,0,0);const tomorrow=new Date(today);tomorrow.setDate(tomorrow.getDate()+1);d.setHours(0,0,0,0);if(d<today)return "overdue";if(ymd(d)===ymd(today))return "today";if(ymd(d)===ymd(tomorrow))return "tomorrow";return "future"}
function merchantCompleteness(m){const checks=[["merchant","Название мерчанта",m.merchant],["inn","ИНН",m.inn],["city","Город",m.city],["businessType","Тип бизнеса",m.businessType],["contactName","Контактное лицо",m.contactName],["phone","Телефон",m.phone],["manager","Менеджер",m.manager],["product","Продукт",m.product],["status","Статус",m.status],["contract","Договор",m.contractNumber||m.contractDate],["contractPdf","PDF договора",m.contractPdfUrl],["logo","Логотип",m.logoUrl],["telegram","Telegram-группа",m.telegramGroupUrl]];const missing=checks.filter(x=>!String(x[2]||"").trim()).map(x=>x[1]);const percent=Math.round((checks.length-missing.length)/checks.length*100);return{percent,missing,total:checks.length,filled:checks.length-missing.length}}
function merchantIsIncomplete(m,type){const c=merchantCompleteness(m);if(!type)return true;if(type==="all")return c.missing.length>0;if(type==="contract")return !(m.contractNumber||m.contractDate);if(type==="pdf")return !String(m.contractPdfUrl||"").trim();if(type==="logo")return !String(m.logoUrl||"").trim();if(type==="telegram")return !String(m.telegramGroupUrl||"").trim();if(type==="phone")return !String(m.phone||"").trim();return true}

function spRequestTaskNotifications(){
  try{
    if(!("Notification" in window)){toast("Браузер не поддерживает уведомления");return;}
    if(Notification.permission==="granted"){toast("Уведомления уже включены");return;}
    Notification.requestPermission().then(p=>toast(p==="granted"?"Уведомления включены":"Уведомления не разрешены"));
  }catch(e){toast("Не удалось включить уведомления");}

function notifyAssignedTasks(){
  const u=currentUser&&currentUser();
  if(!u||!Array.isArray(state.tasks))return;
  const seenNew=new Set(state.seenTaskIds||[]);
  const seenDeadline=spTaskNotifyStorage("sp_seen_task_deadline_keys");
  const todayKey=spTodayKey();
  const activeMine=state.tasks.filter(task=>{
    const id=String(task.id||task.createdAt||task.title||"").trim();
    return id && !taskIsClosed(task) && !taskIsDeleted(task) && spTaskAssignedToCurrentUser(task);
  });

  const newTasks=activeMine.filter(task=>{
    const id=String(task.id||task.createdAt||task.title||"").trim();
    return id && !seenNew.has(id);
  });
  if(spTaskNotificationAllowed("new","browser")) newTasks.slice(0,3).forEach(task=>showTaskToast(task,"new"));
  newTasks.forEach(task=>seenNew.add(String(task.id||task.createdAt||task.title||"")));
  state.seenTaskIds=[...seenNew];
  localStorage.setItem("sp_seen_task_ids",JSON.stringify(state.seenTaskIds.slice(-600)));

  const deadlineTasks=activeMine.filter(spIsDueTomorrow).filter(task=>{
    const id=String(task.id||task.createdAt||task.title||"").trim();
    const key=`${todayKey}|${id}|${spTaskDateKey(task.dueDate)}`;
    return id && !seenDeadline.has(key);
  });
  if(spTaskNotificationAllowed("deadline","browser")) deadlineTasks.slice(0,3).forEach(task=>showTaskToast(task,"deadline"));
  deadlineTasks.forEach(task=>{
    const id=String(task.id||task.createdAt||task.title||"").trim();
    seenDeadline.add(`${todayKey}|${id}|${spTaskDateKey(task.dueDate)}`);
  });
  spSaveTaskNotifyStorage("sp_seen_task_deadline_keys",seenDeadline);

  const seenOverdue=spTaskNotifyStorage("sp_seen_task_overdue_keys");
  const overdueTasks=activeMine.filter(task=>isOverdue(task.dueDate)).filter(task=>{
    const id=String(task.id||task.createdAt||task.title||"").trim();
    return id&&!seenOverdue.has(`${todayKey}|${id}|${spTaskDateKey(task.dueDate)}`);
  });
  if(spTaskNotificationAllowed("overdue","browser")) overdueTasks.slice(0,3).forEach(task=>showTaskToast(task,"overdue"));
  overdueTasks.forEach(task=>{
    const id=String(task.id||task.createdAt||task.title||"").trim();
    seenOverdue.add(`${todayKey}|${id}|${spTaskDateKey(task.dueDate)}`);
  });
  spSaveTaskNotifyStorage("sp_seen_task_overdue_keys",seenOverdue);

  const seenCompleted=spTaskNotifyStorage("sp_seen_task_completed_keys");
  const completedMine=state.tasks.filter(task=>taskIsClosed(task)&&!taskIsDeleted(task)&&spTaskAssignedToCurrentUser(task)).filter(task=>{
    const id=String(task.id||task.createdAt||task.title||"").trim();
    return id&&!seenCompleted.has(id);
  });
  if(spTaskNotificationAllowed("completed","browser")) completedMine.slice(0,3).forEach(task=>showTaskToast(task,"completed"));
  completedMine.forEach(task=>seenCompleted.add(String(task.id||task.createdAt||task.title||"")));
  spSaveTaskNotifyStorage("sp_seen_task_completed_keys",seenCompleted);
}
function showTaskToast(task,type="new"){
  if(!spTaskNotificationAllowed(type,'browser')) return;
  let wrap=document.getElementById("taskToastWrap");
  if(!wrap){wrap=document.createElement("div");wrap.id="taskToastWrap";wrap.className="task-toast-wrap";document.body.appendChild(wrap)}
  const el=document.createElement("div");
  el.className="task-toast";
  const title=spTaskNotificationTitle(type);
  const permissionBtn=("Notification" in window && Notification.permission==="default") ? `<button type="button" data-role="permission">🔔 Включить</button>` : "";
  el.innerHTML=`<b>${esc(title)}</b><small>Мерчант: ${esc(task.merchant||"-")}<br>Задача: ${esc(task.title||"-")}<br>Срок: ${esc(fmtDate(task.dueDate)||"без срока")}</small><br><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-role="open">Открыть задачи</button>${permissionBtn}</div>`;
  const openBtn=el.querySelector('[data-role="open"]');
  if(openBtn) openBtn.onclick=()=>{el.remove();setView("tasks")};
  const permission=el.querySelector('[data-role="permission"]');
  if(permission) permission.onclick=()=>spRequestTaskNotifications();
  wrap.appendChild(el);
  spMaybeBrowserNotify(type,task);
  setTimeout(()=>{if(el&&el.parentNode)el.remove()},type==="deadline"?14000:11000);
}

function normalizeAccessLevel(value,position="",login=""){

  const l=String(login||"").trim().toLowerCase();

function normalizeDirectoryValue(v){
  return String(v||"").replace(/\s+/g," ").trim();
}
function uniqByNormalized(list=[]){
  const seen=new Set(), out=[];
  (Array.isArray(list)?list:[]).forEach(x=>{
    const value=normalizeDirectoryValue(x);
    if(!value) return;
    const key=normalizeFilterValue(value);
    if(seen.has(key)) return;
    seen.add(key); out.push(value);
  });
  return out;
}
function splitDirectoryLines(list=[]){
  const out=[];
  (Array.isArray(list)?list:[]).forEach(item=>{
    String(item||"").split(/\r?\n+/).forEach(part=>{
      const value=normalizeDirectoryValue(part);
      if(value) out.push(value);
    });
  });
  return out;
}
function extractKnownDirectoryItems(raw,catalog=[]){
  const value=normalizeDirectoryValue(raw);
  if(!value) return [];
  const normValue=normalizeFilterValue(value);
  const known=uniqByNormalized(catalog).sort((a,b)=>String(b).length-String(a).length);
  const found=[];
  known.forEach(item=>{
    const normItem=normalizeFilterValue(item);
    if(normItem && normValue.includes(normItem)) found.push(item);
  });
  const uniq=uniqByNormalized(found);
  if(uniq.length>1) return uniq;
  if(uniq.length===1 && normValue===normalizeFilterValue(uniq[0])) return uniq;
  return [value];
}
function dedupeDirectoryList(list=[],catalog=[]){
  const raw=splitDirectoryLines(list);
  const expanded=[];
  raw.forEach(item=>expanded.push(...extractKnownDirectoryItems(item,catalog)));
  return uniqByNormalized(expanded);
}
function sortDirectoryList(list=[],catalog=[]){
  return dedupeDirectoryList(list,catalog).sort((a,b)=>String(a).localeCompare(String(b),'ru',{sensitivity:'base'}));
}
function settingsList(name,fallback=[]){
  const saved=(state.appSettings && Array.isArray(state.appSettings[name])) ? state.appSettings[name] : [];
  const savedClean=dedupeDirectoryList(saved,fallback);
  const fallbackClean=dedupeDirectoryList(fallback);
  if(name==="statuses") return cleanMerchantStatusesList(savedClean.length?savedClean:fallbackClean);
  return sortDirectoryList(savedClean.length?savedClean:fallbackClean);
}
function lastMerchantActivityDate(m){
  const name=String(m.merchant||"").trim().toLowerCase();
  const id=String(m.id||"").trim().toLowerCase();
  const dates=[];
  if(m.updatedAt) dates.push(parseAnyDate(m.updatedAt));
  if(m.createdAt) dates.push(parseAnyDate(m.createdAt));
  (state.history||[]).forEach(h=>{
    const obj=String(h.object||"").toLowerCase();
    const det=String(h.details||"").toLowerCase();
    if((name && (obj.includes(name)||det.includes(name))) || (id && (obj.includes(id)||det.includes(id)))){
      const d=parseAnyDate(h.date);
      if(d) dates.push(d);
    }
  });
  const valid=dates.filter(d=>d && !isNaN(d));
  if(!valid.length) return null;
  return valid.sort((a,b)=>b-a)[0];
}
function merchantInactivity(m){
  if(String(m.status||"").toLowerCase().includes("актив")) return null;
  const d=lastMerchantActivityDate(m);
  if(!d) return {days:999,label:"Нет активности 30+ дней",cls:"inactivity-30"};
  const now=new Date(); now.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  const days=Math.floor((now-d)/86400000);
  if(days>=30) return {days,label:"Нет активности 30+ дней",cls:"inactivity-30"};
  if(days>=14) return {days,label:"Нет активности 14+ дней",cls:"inactivity-14"};
  if(days>=7) return {days,label:"Нет активности 7+ дней",cls:"inactivity-7"};
  return null;
}

function parseActivityDate(v){
  const s=String(v||"").trim();
  if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})/);
  if(m) return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/);
  if(m) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]),Number(m[5]));
  const d=new Date(s);
  return isNaN(d)?null:d;
}
function lastMerchantActivityDate(m){
  const name=String(m.merchant||"").trim().toLowerCase();
  const id=String(m.id||"").trim().toLowerCase();
  const dates=[];
  [m.updatedAt,m.createdAt,m.contractDate].forEach(v=>{
    const d=parseActivityDate(v);
    if(d) dates.push(d);
  });
  (state.history||[]).forEach(h=>{
    const obj=String(h.object||"").toLowerCase();
    const det=String(h.details||"").toLowerCase();
    if((name && (obj.includes(name)||det.includes(name))) || (id && (obj.includes(id)||det.includes(id)))){
      const d=parseActivityDate(h.date);
      if(d) dates.push(d);
    }
  });
  const valid=dates.filter(d=>d && !isNaN(d));
  if(!valid.length) return null;
  return valid.sort((a,b)=>b-a)[0];
}
function merchantInactivity(m){
  const status=String(m.status||"").toLowerCase();
  if(status.includes("актив") || status.includes("фаъол")) return null;
  const d=lastMerchantActivityDate(m);
  if(!d) return {days:999,label:"Нет активности 30+ дней",cls:"inactivity-30"};
  const now=new Date(); now.setHours(0,0,0,0);
  d.setHours(0,0,0,0);
  const days=Math.floor((now-d)/86400000);
  if(days>=30) return {days,label:"Нет активности 30+ дней",cls:"inactivity-30"};
  if(days>=14) return {days,label:"Нет активности 14+ дней",cls:"inactivity-14"};
  if(days>=7) return {days,label:"Нет активности 7+ дней",cls:"inactivity-7"};
  return null;
}

function todayKey(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateToKey(v){
  let d=null;
  if(typeof parseActivityDate==="function") d=parseActivityDate(v);
  else d=new Date(v);
  if(!d || isNaN(d)) return "";
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function isTodayValue(v){return dateToKey(v)===todayKey();}

function getFilteredMerchants(){
  const text=String(state.filterText||"").toLowerCase();
  return state.merchants.filter(m=>{
    const byStatus=merchantMatchesStatusFilter(m,state.filterStatus);
    const byFunnel=!state.funnelStageFilter || merchantFunnelStage(m)===state.funnelStageFilter;
    const hasContract=!!(m.contractNumber||m.contractDate);
    const byContract=!state.contractFilter || (state.contractFilter==="with"?hasContract:!hasContract);
    const byBusiness=!state.filterBusinessType || normalizeFilterValue(m.businessType)===normalizeFilterValue(state.filterBusinessType);
    const hay=[m.merchant,m.inn,m.city,m.businessType,m.manager,canAccessPartners()?m.partnerName:"",m.product,m.comment,m.contractNumber,m.contractDate,m.contractRate,m.phone,m.contactName].join(" ").toLowerCase();
    const byIncomplete=!state.incompleteFilter || merchantIsIncomplete(m,state.incompleteFilter);
    const byManager=!state.filterManager || String(m.manager||"").trim()===state.filterManager;
    const byPartner=!canAccessPartners() || !state.filterPartner || (state.filterPartner==="__none__" ? !String(m.partnerId||"").trim() : state.filterPartner==="__all_partner__" ? !!String(m.partnerId||"").trim() : String(m.partnerId||"")===String(state.filterPartner));
    const byInactivity=!state.inactivityFilter || (merchantInactivity(m) && merchantInactivity(m).days>=Number(state.inactivityFilter));
    return byStatus && byFunnel && byContract && byBusiness && byManager && byPartner && byIncomplete && byInactivity && (!text || hay.includes(text));
  });
}

function normalizeFilterValue(v){return String(v||"").trim().toLowerCase()}
function statusSortWeight(status){
  const s=String(status||"").trim().toLowerCase();
  if(s.includes("актив")||s.includes("фаъол")) return 0;
  if(s.includes("тест")||s.includes("санҷ")) return 1;
  if(s.includes("интеграц")||s.includes("ҳамгир")) return 2;
  if(s.includes("договор")||s.includes("шартнома")) return 3;
  if(s.includes("процесс")||s.includes("раванд")) return 4;
  if(s.includes("работ")||s.includes("кор")) return 5;
  if(s.includes("ожид")) return 6;
  if(s.includes("потенциал")||s.includes("нов")||s.includes("нав")) return 7;
  if(s.includes("нет ответа")||s.includes("ҷавоб")) return 8;
  if(s.includes("проблем")||s.includes("мушкил")) return 9;
  if(s.includes("заморож")) return 10;
  return 11;
}
function prioritySortWeight(priority){
  const s=String(priority||"").trim().toLowerCase();
  if(s.includes("выс")||s.includes("баланд")) return 0;
  if(s.includes("сред")||s.includes("миёна")) return 1;
  if(s.includes("низ")||s.includes("паст")) return 2;
  return 3;
}
function sortMerchants(list){
  return [...list].sort((a,b)=>{
    const sw=statusSortWeight(a.status)-statusSortWeight(b.status);
    if(sw) return sw;
    const pw=prioritySortWeight(a.priority)-prioritySortWeight(b.priority);
    if(pw) return pw;
    return String(a.merchant||"").localeCompare(String(b.merchant||""), 'ru');
  });
}

function prepareBulkMerchantConfirm(){
  const ids=Array.from(document.querySelectorAll('#modalCard input[name="bulkMerchant"]:checked')).map(x=>String(x.value));
  if(!ids.length){toast("Выберите мерчантов");return;}
  const manager=String(document.getElementById("bulkManager")?.value||"").trim();
  const status=String(document.getElementById("bulkStatus")?.value||"").trim();
  const priorityValue=document.getElementById("bulkPriority")?.value;
  const priority=String(priorityValue||"").trim();
  if(!manager && !status && priorityValue===""){toast("Выберите действие");return;}
  window.__bulkPendingAction={ids,manager,status,priorityValue,priority};
  const changes=[];
  if(manager) changes.push(manager==="__CLEAR__"?"Менеджер будет очищен":`Менеджер: ${manager}`);
  if(status) changes.push(status==="__CLEAR__"?"Статус будет очищен":`Статус: ${tr(status)}`);

async function executeBulkMerchantActionsSafe(){
  const data=window.__bulkPendingAction;
  if(!data || !data.ids || !data.ids.length){toast("Нет выбранных данных");return;}
  const user=currentUser()?.fio||currentUser()?.login||"Пользователь";
  const selected=state.merchants.filter(m=>data.ids.includes(String(m.id)));
  try{
    showLoader(true);
    for(const m of selected){
      const updated={...m,user};
      if(data.manager) updated.manager=data.manager==="__CLEAR__"?"":data.manager;
      if(data.status) updated.status=data.status==="__CLEAR__"?"":data.status;
      if(data.priorityValue!=="") updated.priority=data.priorityValue==="__CLEAR__"?"":data.priority;
      if(CONFIG.API_URL) await api("saveMerchant",{merchant:updated});
      else Object.assign(m,updated);
    }
    window.__bulkPendingAction=null;
    closeModal();
    await loadData();
    toast(`Массовое изменение выполнено: ${selected.length}`);
  }catch(e){toast(e.message||String(e));}
  finally{showLoader(false);}
}

}

function partnerIsActive(p){
  const s=String(p?.status||"").toLowerCase();
  return (s.includes("актив")||s.includes("фаъол"))&&!s.includes("неактив");

function partnerStatusClass(status){
  const s=String(status||"").toLowerCase();
  if(s.includes("неактив")||s.includes("отключ")||s.includes("закры")||s.includes("приост")) return "off";
  if(s.includes("актив")||s.includes("фаъол")) return "active";
  return statusClass(status);
}
function cleanNumber(v){
  const s=String(v??"").replace(/\s/g,"").replace(",",".").replace(/[^0-9.-]/g,"");
  const n=Number(s); return Number.isFinite(n)?n:0;
}
function partnerStats(p){
  const list=partnerMerchants(p);
  const active=list.filter(m=>String(m.status||"").toLowerCase().includes("актив")||String(m.status||"").toLowerCase().includes("фаъол")).length;
  const contracts=list.filter(m=>m.contractNumber||m.contractDate).length;
  const revenue=list.reduce((a,m)=>a+cleanNumber(m.revenue),0);
  const invoices=list.reduce((a,m)=>a+cleanNumber(m.invoices),0);
  return {list,total:list.length,active,contracts,revenue,invoices,activeRate:list.length?Math.round(active/list.length*100):0};
}
function partnerCommissionLabel(p){
  const type=String(p?.commissionType||"").trim();

  if(!type && !value) return "—";

  if(type.toLowerCase().includes("фикс")) return `${value||0} TJS ${partnerText("за мерчанта","барои мерчант")}`;

function commentLineDateValue(line){
  const s=String(line||"").trim();
  // Поддержка форматов: 16.06.2026, 09:00:38 — Умед: ...
  // и 16.06.2026 09:00:38 — Умед: ...
  let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:[,\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0)).getTime();
  }
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T\s]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if(m){
    return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),Number(m[4]||0),Number(m[5]||0),Number(m[6]||0)).getTime();
  }
  return 0;
}

}

function safeUrl(url){
  let v=String(url||"").trim();
  if(!v) return "";
  if(v.startsWith("@")) v="https://t.me/"+v.slice(1);
  else if(/^t\.me\//i.test(v) || /^telegram\.me\//i.test(v)) v="https://"+v;
  else if(!/^https?:\/\//i.test(v) && !/^tel:/i.test(v)) v="https://"+v;
  return v.replace(/"/g,"%22");
}
function normalizePhoneForTel(phone){
  const raw=String(phone||"").trim();
  if(!raw) return "";
  const digits=raw.replace(/[^0-9+]/g,"");
  if(digits.startsWith("+")) return digits;
  if(digits.length===9) return "+992"+digits;
  return digits;
}

function parseAnyDate(v){
  const s=String(v||"").trim();
  if(!s) return null;
  let m=s.match(/^(\d{2})[.\/-](\d{2})[.\/-](\d{4})/);
  if(m) return new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));
  const d=new Date(s);
  return isNaN(d)?null:d;
}
function monthLabel(d){return String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear()}
function countContractsByMonth(sortMode=state.contractMonthSort||"date"){
  const out={};
  state.merchants.forEach(m=>{
    if(!(m.contractNumber||m.contractDate)) return;
    const d=parseAnyDate(m.contractDate);
    const key=d?monthLabel(d):t("notSpecified");
    out[key]=(out[key]||0)+1;
  });
  const entries=Object.entries(out);
  const dateKey=(label)=>{
    const parts=String(label).split('.').map(Number);
    if(parts.length>=2 && parts[0] && parts[1]) return parts[1]*100+parts[0];
    return -1;
  };
  entries.sort((a,b)=>{
    if(sortMode==="count") return Number(b[1])-Number(a[1]) || dateKey(b[0])-dateKey(a[0]);
    return dateKey(b[0])-dateKey(a[0]) || Number(b[1])-Number(a[1]);
  });
  return Object.fromEntries(entries);
}
function setContractMonthSort(value){
  state.contractMonthSort=value||"date";
  localStorage.setItem("sp_contract_month_sort", state.contractMonthSort);
  renderAnalytics();
}
function contractsThisMonth(){
  const now=new Date(); const key=monthLabel(now);
  return countContractsByMonth()[key]||0;
}
function filterByContractPeriod(list,from,to){
  const fd=from?parseAnyDate(from):null, td=to?parseAnyDate(to):null;
  if(!fd && !td) return list;
  return list.filter(m=>{const d=parseAnyDate(m.contractDate); if(!d) return false; if(fd && d<fd) return false; if(td && d>td) return false; return true;});
}

function chartPanel(title,obj,trunc=false,mini=false,controls="",preserveOrder=false){
  const key=chartKey(title);
  const expanded=!!state.expandedCharts[key];
  let entries=Object.entries(obj).filter(([,v])=>Number(v)>0);
  if(!preserveOrder){
    entries=entries.sort((a,b)=>b[1]-a[1]);
  }
  const max=Math.max(1,...entries.map(([,v])=>Number(v)));
  const total=entries.reduce((a,[,v])=>a+Number(v),0);
  const visible=(mini && !expanded)?entries.slice(0,6):entries;
  if(!visible.length){
    return `<section class="panel"><div class="panel-head"><h3>${title}</h3></div><div class="empty-state"><div class="empty-icon">📭</div><h3>${t("noData")}</h3><p>По выбранному фильтру ничего не найдено.<br>Попробуйте изменить фильтр или очистить поиск.</p></div></section>`;
  }
  const rows=visible.map(([k,v])=>{
    const value=Number(v);
    const pct=total?Math.round(value/total*100):0;
    const label=String(k||t("notSpecified"));
    const shortLabel=trunc && label.length>22 ? label.slice(0,22)+"..." : label;
    return `<div class="bar">
      <div class="bar-top"><span class="bar-label" title="${esc(label)}">${esc(shortLabel)}</span><span class="bar-value">${value} · ${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,value/max*100)}%"></div></div>
    </div>`;
  }).join("");
  const more=entries.length>6 ? `<div class="chart-note"><button onclick="toggleChart('${esc(key)}')">${expanded?t("hide"):`+ ${entries.length-6} ${t("moreItems")} · ${t("showAll")}`}</button></div>` : "";
  return `<section class="panel chart-panel"><div class="panel-head"><h3>${title}</h3>${controls||""}</div><div class="chart-summary"><div><b>${total}</b><br><span>${t("totalRecords")}</span></div><span>${t("barChartHint")}</span></div><div class="chart-list">${rows}</div>${more}</section>`;
}

function openTextModal(title,text,label="product"){
  const isComment = label==="comment" || label==="comment-modal";
  const lab = isComment ? t("comments") : t("productText");
  const icon = isComment ? "💬" : "📦";
  const content = isComment
    ? `<div class="sp-text-modal-box merchant-comment-modal-text">${esc(text||"—")}</div>`
    : `<div class="sp-text-modal-box sp-product-modal-text">${esc(text||"—")}</div>`;
  showModal(`<div class="sp-text-modal">
    <button class="modal-close sp-text-modal-close" onclick="closeModal()" aria-label="Закрыть">×</button>
    <div class="sp-text-modal-head"><div class="sp-text-modal-icon">${icon}</div><div><h3>${esc(title||lab)}</h3><p>${lab}</p></div></div>
    <div class="field sp-text-modal-field"><label>${lab}</label>${content}</div>
    <div class="modal-actions sp-text-modal-actions"><button class="btn primary" onclick="closeModal()">${t("ok")}</button></div>
  </div>`,{topLayer:true,modalClass:'sp-text-overlay',cardClass:'sp-text-card'});
}
function initials(name){
  const parts=String(name||"SP").trim().split(/\s+/).filter(Boolean);
  return ((parts[0]?.[0]||"S")+(parts[1]?.[0]||"P")).toUpperCase();
}
function logoSrc(url){
  const s=String(url||"").trim();
  if(!s) return "";
  const m=s.match(/drive\.google\.com\/file\/d\/([^/]+)/) || s.match(/[?&]id=([^&]+)/);
  if(m) return "https://drive.google.com/thumbnail?id="+m[1]+"&sz=w300";
  return s;
}
function merchantLogo(m,mode="mini"){
  const url=logoSrc(m.logoUrl);
  const base=mode==="profile"?"profile-logo":"merchant-mini-logo";
  const cls=base + (url?" has-logo":" no-logo");
  const alt=esc(m.merchant||"logo");
  return `<div class="${cls}">${url?`<img src="${esc(url)}" alt="${alt}" onerror="this.parentElement.classList.remove('has-logo');this.parentElement.classList.add('no-logo');this.parentElement.textContent='${esc(initials(m.merchant))}'">`:esc(initials(m.merchant))}</div>`;
}

    <div class="profile-head">
      ${merchantLogo(m,"profile")}
      <div class="profile-title"><h3>${esc(m.merchant||t("merchant"))}</h3><div class="sub">${esc(tr(m.businessType||t("notSpecified")))} · ${esc(tr(m.city||t("notSpecified")))}</div></div>
      <div class="profile-chips"><span class="chip status ${statusClass(m.status)}">${esc(tr(m.status||t("notSpecified")))}</span>${m.priority?`<span class="chip ${priorityClass(m.priority)}">${esc(tr(m.priority))}</span>`:""}</div>
    </div>
    <div class="profile-grid">
      ${infoTile(t("inn"),m.inn)}
      ${infoTile(t("contacts"),`${m.phone||"—"}${m.contactName?" · "+tr(m.contactName):""}`)}
      ${infoTile(t("manager"),tr(m.manager||""))}

      ${canAccessPartners()?infoTile(state.lang==="tj"?"Санаи ҷалб":"Дата привлечения",fmtDate(m.partnerReferralDate)||"—"):""}

      ${infoTile(t("contractPdf"),m.contractPdfUrl?t("openContractPdf"):t("pdfNotUploaded"))}
      ${infoTile(t("telegramGroup"),m.telegramGroupUrl?t("openTelegram"):t("notSpecified"))}

    ${!m.comment?`<div class="featured-comment"><div class="featured-comment-head"><b>${t("comments")}</b><button class="btn icon" data-tip="Добавить комментарий" onclick="toggleInlineMerchantComment('${esc(id)}')">＋</button></div><p>Комментариев пока нет</p>${inlineMerchantCommentHtml(id)}</div>`:""}

function openMerchantViewModal(id=""){
  showModal(merchantProfileHtml(id));
}
function openMerchantViewDrawer(id=""){
  const m=state.merchants.find(x=>x.id===id);
  if(!m) return;
  const body=qs("#merchantDrawerBody");
  const title=qs("#merchantDrawerTitle");
  if(title) title.textContent=m.merchant||t("merchantCard");
  if(body) body.innerHTML=merchantProfileHtml(id);
  qs("#merchantDrawer")?.classList.add("show");
}
function closeMerchantDrawer(){
  const d=qs("#merchantDrawer");
  if(d) d.classList.remove("show");
}
function editMerchantFromDrawer(id=""){
  closeMerchantDrawer();

function normalizeMerchantStatusValue(value){
  const raw=String(value||"").trim();
  const s=raw.toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ");
  if(!s)return "";
  if(s==="новый"||s.includes("потенциал")||s.includes("эҳтимол"))return "Потенциальный";
  if(s==="в процессе"||s==="на процессе"||s==="в работе"||s.includes("дар кор")||s.includes("раванд"))return "В работе";
  if(s.includes("ожидает документы")||s.includes("ожидаем документы")||s.includes("нет документов")||s.includes("интизори ҳуҷҷат"))return "Ожидаем документы";
  if(s.includes("договор")||s.includes("шартнома"))return "Договор";
  if(s.includes("интеграц")||s.includes("ҳамгир")||s.includes("техническая интеграция"))return "Интеграция";
  if(s.includes("тест")||s.includes("санҷиш"))return "Тест";
  if(s.includes("актив")||s.includes("фаъол"))return "Активный";
  if(s.includes("заморож")||s.includes("пауза")||s.includes("муваққатан")||s.includes("проблем"))return "Заморожен";
  if(s.includes("нет ответа")||s.includes("ҷавоб нест"))return "Нет ответа";
  if(s.includes("отказ")||s.includes("рад")||s.includes("даст каш"))return "Отказ";
  if(s.includes("архив")||s.includes("бойгон")||s.includes("основной список"))return "";
  return raw;
}
function cleanMerchantStatusesList(list){
  const allowed=MERCHANT_STATUSES;
  const seen=new Set();
  (Array.isArray(list)?list:[]).forEach(x=>{
    const v=normalizeMerchantStatusValue(x);
    if(v&&allowed.includes(v))seen.add(v);
  });
  return allowed.filter(x=>seen.has(x)||true);
}
function normalizeMerchantStatusesInList(list){
  return (Array.isArray(list)?list:[]).map(m=>{
    if(!m)return m;
    const status=normalizeMerchantStatusValue(m.status);
    return status&&status!==m.status?{...m,status}:m;
  });
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||"").split(",").pop());
    reader.onerror=()=>reject(new Error("Не удалось прочитать файл логотипа"));
    reader.readAsDataURL(file);
  });
}

async function saveMerchant(id, btn){
  const card=qs('#spMerchantEditCard [data-merchant-form="1"]') || qs('#spMerchantEditCard') || qs('#merchantDrawerBody [data-merchant-form="1"]') || qs("#modalCard") || qs("#merchantDrawerBody");
  let valid=true;
  let firstInvalid=null;
  card.querySelectorAll(".required-missing").forEach(x=>x.classList.remove("required-missing"));
  card.querySelectorAll("[data-required='1']").forEach(el=>{
    const empty=!String(el.value||"").trim();
    const combo=el.closest('.combo-field');
    if(combo){
      const sel=combo.querySelector('[data-combo-select]');
      const custom=combo.querySelector('[data-combo-custom]');
      const hidden=combo.querySelector('input[type="hidden"]');
      const bad=!String(hidden?.value||"").trim();
      combo.classList.toggle("required-missing", bad);
      sel.classList.toggle("invalid", bad && sel.value!=="__custom__");
      custom.classList.toggle("invalid", bad && sel.value==="__custom__");
      if(bad){ valid=false; if(!firstInvalid) firstInvalid=(sel.value==="__custom__"?custom:sel); }
      return;
    }
    const fieldWrap=el.closest('.field');
    if(fieldWrap) fieldWrap.classList.toggle("required-missing", empty);
    el.classList.toggle("invalid", empty);
    if(empty){ valid=false; if(!firstInvalid) firstInvalid=el; }
  });
  if(!valid){
    toast(t("requiredError"));
    if(firstInvalid){ firstInvalid.scrollIntoView({behavior:"smooth",block:"center"}); setTimeout(()=>firstInvalid.focus(),250); }
    return;
  }
  const obj={id};
  card.querySelectorAll("[name]").forEach(el=>obj[el.name]=el.value);
  obj.status=normalizeMerchantStatusValue(obj.status)||obj.status;
  obj.user=(currentUser()?.fio||currentUser()?.login||"Пользователь");
  setButtonLoading(btn,true,"Сохраняем...");
  showLoader(true);
  const logoFile=card.querySelector("#merchantLogoFile")?.files?.[0];
  if(logoFile){
    const allowed=["image/png","image/jpeg","image/jpg","image/webp"];
    if(!allowed.includes(logoFile.type)){toast("Разрешены только PNG, JPG, JPEG, WEBP");showLoader(false);setButtonLoading(btn,false);return;}
    if(logoFile.size>2*1024*1024){toast("Логотип должен быть до 2 МБ");showLoader(false);setButtonLoading(btn,false);return;}
    obj.logoBase64=await fileToBase64(logoFile);
    obj.logoFileName=logoFile.name;
    obj.logoMimeType=logoFile.type;
  }
  const pdfFile=card.querySelector("#contractPdfFile")?.files?.[0];
  if(pdfFile){
    if(pdfFile.type!=="application/pdf" && !pdfFile.name.toLowerCase().endsWith(".pdf")){toast("Разрешен только PDF");showLoader(false);setButtonLoading(btn,false);return;}
    if(pdfFile.size>10*1024*1024){toast("PDF договора должен быть до 10 МБ");showLoader(false);setButtonLoading(btn,false);return;}
    obj.contractPdfBase64=await fileToBase64(pdfFile);
    obj.contractPdfFileName=pdfFile.name;
    obj.contractPdfMimeType=pdfFile.type || "application/pdf";
  }
  try{
    if(CONFIG.API_URL) await api("saveMerchant",{merchant:obj});
    else {
      if(id){const i=state.merchants.findIndex(x=>x.id===id);state.merchants[i]={...state.merchants[i],...obj};}
      else state.merchants.push({...obj,id:"M"+Date.now()});
    }
    closeModal(); if(typeof closeMerchantEditOverlay==="function") closeMerchantEditOverlay(); closeMerchantDrawer(); await loadData(); toast(t("saved"));
  }catch(e){toast(e.message)}finally{showLoader(false);setButtonLoading(btn,false)}
}

function exportExecutiveReportFromModal(){
  const card=qs("#modalCard");
  const opts={
    from: card.querySelector('[name="reportFrom"]').value,
    to: card.querySelector('[name="reportTo"]').value,
    summary: card.querySelector('[name="secSummary"]').checked,
    charts: card.querySelector('[name="secCharts"]').checked,
    merchants: card.querySelector('[name="secMerchants"]').checked,
    tasks: card.querySelector('[name="secTasks"]').checked,
    history: card.querySelector('[name="secHistory"]').checked
  };
  closeModal();
  exportExecutiveReport(opts);
}
function exportExecutiveReport(opts={summary:true,charts:true,merchants:true,tasks:false,history:false}){
  const merchants=filterByContractPeriod(managementMerchants(),opts.from,opts.to);
  const total=merchants.length;
  const active=merchants.filter(x=>String(x.status).toLowerCase().includes("актив")).length;
  const integration=merchants.filter(x=>String(x.status).toLowerCase().includes("интеграц")||String(x.status).toLowerCase().includes("тест")).length;
  const contracts=merchants.filter(x=>x.contractNumber||x.contractDate).length;
  const withPdf=merchants.filter(x=>x.contractPdfUrl).length;
  const generated=new Date().toLocaleString('ru-RU');
  const period=(opts.from||opts.to)?`${opts.from||"..."} — ${opts.to||"..."}`:t("allPeriod");
  const summaryHtml=opts.summary?`<div class="grid"><div class="k"><b>${total}</b><span>${t("total")}</span></div><div class="k"><b>${active}</b><span>${t("active")}</span></div><div class="k"><b>${integration}</b><span>${t("integrationTest")}</span></div><div class="k"><b>${contracts}</b><span>${t("withContract")}</span></div><div class="k"><b>${withPdf}</b><span>${t("contractPdf")}</span></div></div>`:"";

  const partnerReportHead=canAccessPartners()?`<th>${state.lang==="tj"?"Шарик":"Партнер"}</th>`:"";

  const tasksHtml=opts.tasks?`<div class="section"><h3>${t("tasks")}</h3><table><tr><th>${t("merchant")}</th><th>${t("taskTitle")}</th><th>${t("taskFor")}</th><th>${t("dueDate")}</th><th>${t("status")}</th></tr>${spOperationalTasks().map(x=>`<tr><td>${esc(x.merchant)}</td><td>${esc(x.title)}</td><td>${esc(x.assignee)}</td><td>${esc(fmtDate(x.dueDate))}</td><td>${esc(x.status)}</td></tr>`).join("")}</table></div>`:"";
  const historyHtml=opts.history?`<div class="section"><h3>${t("history")}</h3><table><tr><th>${t("date")}</th><th>${t("action")}</th><th>${t("object")}</th><th>${t("details")}</th></tr>${(state.history||[]).slice(0,100).map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(tr(x.action))}</td><td>${esc(tr(x.object))}</td><td>${esc(tr(x.details))}</td></tr>`).join("")}</table></div>`:"";

  "umed@smartpay.com":"umed@smartpay.tj",

  "jahongir@smartpay.com":"jahongir@smartpay.tj",

};
function normalizeLogin(login){
  const raw = String(login || '').trim();
  const key = raw.toLowerCase();
  return LOGIN_MIGRATION[key] || raw;
}
function getUsers(){
  const defaults = CRM_USERS_DEFAULT.map(u=>({...u, login:String(u.login||'').trim()}));
  let saved=[];
  try{ const raw=JSON.parse(localStorage.getItem('sp_users')||'[]'); if(Array.isArray(raw)) saved=raw; }catch(e){ saved=[]; }
  const byLogin={};
  defaults.forEach(u=>byLogin[String(u.login).toLowerCase()]={...u});
  saved.forEach(u=>{
    u.login = normalizeLogin(u.login);
    const key=String(u.login||'').trim().toLowerCase();
    if(!key) return;
    byLogin[key]={...(byLogin[key]||{}), ...u, login:(byLogin[key]?.login || u.login)};
    if(!byLogin[key].password) byLogin[key].password='1234';
    byLogin[key].accessLevel=normalizeAccessLevel(byLogin[key].accessLevel,byLogin[key].position,byLogin[key].login);
  });
  const users=Object.values(byLogin).map(u=>({...u,accessLevel:normalizeAccessLevel(u.accessLevel,u.position,u.login)}));
  localStorage.setItem('sp_users', JSON.stringify(users));
  return users;
}

    const saved=getUsers().find(u=>String(u.login||"").toLowerCase()===String(fixedLogin).toLowerCase())||{};
    state.currentUser.login = fixedLogin;

function taskIsDeleted(x){
  const s=String((x&&x.status)||'').trim().toLowerCase();
  return !!(x&&x.deleted) || s.includes('удал') || s.includes('deleted') || s.includes('нестшуда');
}
function taskIsClosed(x){
  const s=String((x&&x.status)||'').trim().toLowerCase();
  return taskIsDeleted(x) || s.includes('закры')||s.includes('выполн')||s.includes('closed')||s.includes('пӯшида');
}
function taskRowClass(x){
  const p=String((x&&x.priority)||'').toLowerCase();
  let c=taskIsClosed(x)?'task-closed ':'';
  if(p.includes('выс')||p.includes('баланд')) c+='task-high';
  else if(p.includes('сред')||p.includes('миёна')) c+='task-mid';
  return c;
}
function normalizeTaskStatus(s){
  const v=String(s||'').trim();
  if(!v) return 'Открыта';
  const low=v.toLowerCase();
  if(low.includes('удал')||low.includes('deleted')) return 'Удалена';
  if(low.includes('закры')||low.includes('выполн')||low.includes('closed')) return 'Закрыта';
  return v;
}
function normTaskUser(v){
  return String(v||'').trim().toLowerCase().replace(/\s+/g,' ');
}
function taskCreatorLogin(x){
  return String(x?.createdByLogin||x?.creatorLogin||x?.createdByEmail||x?.creatorEmail||'').trim();
}
function taskCreatorName(x){
  return String(x?.createdByName||x?.creatorName||x?.createdBy||x?.creator||x?.user||taskCreatorLogin(x)||'').trim();
}
function taskOwnerLabel(x){
  return taskCreatorName(x) || 'Не указано';
}
function currentUserKeys(){
  const u=currentUser&&currentUser();
  return [u?.login,u?.fio,u?.position].map(normTaskUser).filter(Boolean);
}
function taskHasOwnerInfo(x){
  return !!(taskCreatorLogin(x)||taskCreatorName(x));
}
function canManageTask(x){
  const keys=currentUserKeys();
  if(!keys.length) return false;
  const ownerKeys=[taskCreatorLogin(x),taskCreatorName(x),x?.createdBy,x?.creator,x?.user].map(normTaskUser).filter(Boolean);
  if(ownerKeys.length) return ownerKeys.some(k=>keys.includes(k));
  // Для старых задач без информации о создателе оставляем аварийный доступ только главному администратору.
  return typeof isMainAdmin==='function' && isMainAdmin();
}
function taskAssignedToCurrentUserForAction(x){
  try{
    if(typeof spTaskAssignedToCurrentUser==='function' && spTaskAssignedToCurrentUser(x)) return true;
  }catch(e){}
  const u=currentUser&&currentUser();
  if(!u||!x) return false;
  const assignee=normTaskUser(x.assignee);
  if(!assignee) return false;
  if(['все','all','ҳама','команда','team'].includes(assignee)) return true;
  const keys=[u.login,u.fio,u.name,u.username].map(normTaskUser).filter(Boolean);
  return keys.some(k=>assignee===k || (assignee.length>2&&k.includes(assignee)) || (k.length>2&&assignee.includes(k)));
}
function taskStatusManagementAccess(){
  try{if(typeof isMainAdmin==='function'&&isMainAdmin()) return true;}catch(e){}
  try{if(typeof canAccessPartners==='function'&&canAccessPartners()) return true;}catch(e){}
  const u=currentUser&&currentUser();

function canChangeTaskStatus(x){

function setTaskActionState(options){
  const modalCard=qs('#modalCard');
  if(!modalCard) return ()=>{};
  const root=options?.root || modalCard.querySelector('.task-view-modal') || modalCard.querySelector('.task-modal');
  if(!root) return ()=>{};
  const mode=options?.mode || 'busy';
  const overlay=root.querySelector('.task-action-overlay');
  const messageEl=root.querySelector('.task-action-message');
  const detailEl=root.querySelector('.task-action-detail');
  const buttons=[...root.querySelectorAll('.modal-actions .btn')];
  const inputs=[...root.querySelectorAll('input,select,textarea,button:not(.btn)')];
  const activeBtn=options?.button || null;
  const originalButtons=buttons.map(btn=>({btn, html:btn.innerHTML}));
  const originalInputs=inputs.map(el=>({el, disabled:el.disabled}));
  if(messageEl) messageEl.textContent=options?.message || 'Выполняем действие...';
  if(detailEl) detailEl.textContent=options?.detail || 'Пожалуйста, подождите несколько секунд';
  if(overlay) overlay.setAttribute('aria-hidden','false');
  root.classList.add('is-busy');
  root.dataset.busy='1';
  buttons.forEach(btn=>{ btn.disabled=true; btn.style.pointerEvents='none'; });
  inputs.forEach(el=>{ el.disabled=true; });
  if(activeBtn){
    const label=options?.buttonText || activeBtn.textContent.trim() || 'Сохраняем';
    activeBtn.innerHTML=`<span class="task-action-btn-spinner"></span>${label}`;
  }
  return function release(){
    root.classList.remove('is-busy');
    root.dataset.busy='0';
    if(overlay) overlay.setAttribute('aria-hidden','true');
    originalButtons.forEach(({btn,html})=>{ btn.disabled=false; btn.style.pointerEvents=''; btn.innerHTML=html; });
    originalInputs.forEach(({el,disabled})=>{ el.disabled=disabled; });
  };
}

async function showTaskActionResult(type,message,detail,duration){
  const root=qs('#modalCard .task-view-modal') || qs('#modalCard .task-modal');
  if(!root) return;
  const box=root.querySelector('.task-action-box');
  const messageEl=root.querySelector('.task-action-message');
  const detailEl=root.querySelector('.task-action-detail');
  const icon=root.querySelector('.task-action-result-icon');
  if(!box) return;
  box.classList.remove('is-success','is-error');
  box.classList.add(type==='error'?'is-error':'is-success');
  if(icon) icon.textContent=type==='error'?'!':'✓';
  if(messageEl) messageEl.textContent=message || (type==='error'?'Не удалось выполнить действие':'Готово');
  if(detailEl) detailEl.textContent=detail || '';
  await new Promise(resolve=>setTimeout(resolve, Number(duration)||900));
}

function dateToInput(v){
  const s=String(v||'').trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{2})[.\/\-](\d{2})[.\/\-](\d{4})/); if(m) return `${m[3]}-${m[2]}-${m[1]}`;
  return '';
}
async function setTaskStatusFromView(id,target,btnEl){
  const old=(state.tasks||[]).find(t=>String(t.id||'')===String(id||''));
  if(!old){toast('Задача не найдена');return;}
  if(!canChangeTaskStatus(old)){toast('Изменять статус может автор задачи, назначенный исполнитель или руководство');return;}
  if(taskIsClosed(old) && target==='done'){toast('Задача уже выполнена');return;}
  const u=currentUser&&currentUser();
  const obj={...old};
  if(target==='work'){
    obj.status='В работе';
    obj.completedAt='';
  }else if(target==='done'){
    obj.status='Закрыта';
    obj.completedAt=new Date().toISOString();
  }else if(target==='open'){
    obj.status='Открыта';
    obj.completedAt='';
  }else return;
  obj.updatedAt=new Date().toISOString();
  obj.createdByLogin=old.createdByLogin||old.creatorLogin||old.createdByEmail||'';
  obj.createdByName=old.createdByName||old.creatorName||old.createdBy||old.user||'';
  obj.user=(u?.fio||u?.login||'Пользователь');
  let releaseBusy=()=>{};
  try{
    releaseBusy=setTaskActionState({
      root:qs('#modalCard .task-view-modal'),
      button:btnEl,
      buttonText:target==='done'?'Выполняем...':'Переводим...',
      message:target==='done'?'Отмечаем задачу как выполненную...':'Переводим задачу в работу...',
      detail:'Статус будет обновлён через несколько секунд'
    });
    showLoader(true);
    Object.assign(old,obj);
    if(CONFIG.API_URL) await api('saveTask',{task:obj});
    await showTaskActionResult('success',target==='done'?'Задача выполнена':'Задача переведена в работу','Статус задачи успешно обновлён',700);
    closeModal();
    renderTasks();updateTaskBadge();
    await loadData();
    toast(target==='done'?t('taskDone'):'Задача переведена в работу');
  }catch(e){
    console.error(e);
    await showTaskActionResult('error','Ошибка изменения статуса',String(e.message||e),1400);
    releaseBusy();
    toast('Ошибка изменения статуса: '+(e.message||e));
    try{await loadData();}catch(_){}
  }finally{showLoader(false)}
}

let spAutoRefreshTimer = null;
let spAutoRefreshBusy = false;
let spLastDataSignature = "";

function spBuildDataSignature(merchants, partners, tasks, history){
  try{
    return JSON.stringify({
      merchants:(merchants||[]).map(m=>({
        id:m.id,
        updatedAt:m.updatedAt,
        createdAt:m.createdAt,
        merchant:m.merchant,
        inn:m.inn,
        status:m.status,
        priority:m.priority,
        manager:m.manager,
        comment:m.comment,
        contractNumber:m.contractNumber,
        contractDate:m.contractDate,
        contractPdfUrl:m.contractPdfUrl,
        logoUrl:m.logoUrl,
        telegramGroupUrl:m.telegramGroupUrl,
        partnerId:m.partnerId,
        partnerName:m.partnerName,
        partnerReferralDate:m.partnerReferralDate
      })),
      partners:(partners||[]).map(p=>({
        id:p.id,
        updatedAt:p.updatedAt,
        partnerName:p.partnerName,
        status:p.status,
        manager:p.manager,
        contractNumber:p.contractNumber,
        contractDate:p.contractDate,
        commissionType:p.commissionType,
        commissionValue:p.commissionValue
      })),
      tasks:(tasks||[]).map(t=>({
        id:t.id,
        updatedAt:t.updatedAt,
        createdAt:t.createdAt,
        status:t.status,
        dueDate:t.dueDate,
        comment:t.comment,
        comments:t.comments,
        createdByLogin:t.createdByLogin,
        createdByName:t.createdByName,
        deleted:t.deleted,
        deletedAt:t.deletedAt
      })),
      historyCount:(history||[]).length,
      lastHistory:(history||[]).slice(-3)
    });
  }catch(e){
    return String(Date.now());
  }
}

function spIsAnyCardOpen(){
  return !!(
    document.querySelector('#modal.show') ||
    document.querySelector('#merchantDrawer.show') ||
    document.querySelector('#loginScreen.show')
  );
}

async function spSoftAutoRefresh(){
  if(spAutoRefreshBusy) return;
  if(!CONFIG.API_URL) return;
  if(document.hidden) return;
  if(spIsAnyCardOpen()) return;

  try{
    spAutoRefreshBusy = true;
    const data = await api('getData',{options:{includeChat:false}});
    const newMerchants = visibleMerchantsForCurrentUser(Array.isArray(data.merchants) ? data.merchants : []);
    const newPartners = canAccessPartners() && Array.isArray(data.partners) ? data.partners : [];
    const newTasks = Array.isArray(data.tasks) ? data.tasks : [];
    const newHistory = visibleHistoryForCurrentUser(Array.isArray(data.history) ? data.history : []);
    if(typeof spNcApplyServerState === "function") spNcApplyServerState(data.notificationState);
    if(typeof spApplyNotificationPreferences === "function") spApplyNotificationPreferences(data.notificationPreferences);
    const newSignature = spBuildDataSignature(newMerchants, newPartners, newTasks, newHistory);

    if(!spLastDataSignature){
      spLastDataSignature = spBuildDataSignature(state.merchants, state.partners, state.tasks, state.history);
    }

    if(newSignature !== spLastDataSignature){
      state.merchants = newMerchants;
      state.partners = newPartners;
      state.tasks = newTasks;
      state.history = newHistory;
      state._loadedFromApi = true;
      spLastDataSignature = newSignature;
      render();
      notifyAssignedTasks();
    }
  }catch(e){
    console.warn('Auto refresh skipped:', e);
  }finally{
    spAutoRefreshBusy = false;
  }
}

function spStartAutoRefresh(){
  if(spAutoRefreshTimer) clearInterval(spAutoRefreshTimer);
  spLastDataSignature = spBuildDataSignature(state.merchants, state.partners, state.tasks, state.history);
  spAutoRefreshTimer = setInterval(spSoftAutoRefresh, 60000);
}

// === PWA auto-update: при открытии приложения проверяет новую версию и обновляет интерфейс ===
(function initPWAAutoUpdate(){
  if(!('serviceWorker' in navigator)) return;
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(refreshing) return;
    refreshing = true;
    window.location.reload();
  });
  window.addEventListener('load',async()=>{
    try{
      const reg = await navigator.serviceWorker.register('./sw.js?v=3.10.4');
      await reg.update();
      if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
      reg.addEventListener('updatefound',()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange',()=>{
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            nw.postMessage({type:'SKIP_WAITING'});
          }
        });
      });
    }catch(e){ console.warn('PWA registration failed', e); }
  });
})();

  function spExcelXmlEscape(value){
    return String(value==null?'':value)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }
  function spExcelSafeFilePart(value){
    return String(value||'мерчанты').trim().replace(/[\\/:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,60)||'мерчанты';
  }
  function spExcelToday(){

  }

      const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet" xmlns:html="http://www.w3.org/TR/REC-html40">

<Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Center"/><Borders/><Font ss:FontName="Calibri" ss:Size="11"/><Interior/><NumberFormat/><Protection/></Style>

  window.spSaveMerchantSection=async function(id,payload,btn){
    const m=state.merchants.find(x=>String(x.id)===String(id));if(!m){toast('Мерчант не найден');return;}
    const beforeSection=spMerchantSectionOf(m);
    const merged={...m,...payload,id,user:(currentUser()?.fio||currentUser()?.login||'Пользователь')};
    if(payload.merchantSection==='archive'){
      merged.previousMerchantSection=payload.previousMerchantSection||beforeSection||'main';
      merged.archiveReason=String(payload.archiveReason||'').trim();
      merged.archivedAt=new Date().toISOString();
      merged.archivedBy=currentUser()?.fio||currentUser()?.login||'Пользователь';
    }
    setButtonLoading(btn,true,'Сохраняем...');showLoader(true);
    try{
      if(CONFIG.API_URL) await api('saveMerchant',{merchant:merged});
      else {const i=state.merchants.findIndex(x=>String(x.id)===String(id)); if(i>=0) state.merchants[i]=merged;}
      window.closeArchiveMerchantOverlay?.();closeModal();window.closeMerchantEditOverlay?.();closeMerchantDrawer();await loadData();
      toast(payload.merchantSection==='archive'?'Мерчант перенесён в архив':payload.merchantSection==='potential'?'Мерчант перенесён в потенциальные':'Мерчант перенесён в основной список');
    }
    catch(e){toast(e.message||'Ошибка сохранения')}
    finally{showLoader(false);setButtonLoading(btn,false)}
  };

    const base=spOperationalMerchants(),tasks=spOperationalTasks();
    const managers=[...new Set(base.map(m=>String(m.manager||'').trim()).filter(isRealManager))].sort();
    return managers.map(manager=>{const ms=base.filter(m=>String(m.manager||'').trim()===manager),active=ms.filter(m=>String(m.status||'').toLowerCase().includes('актив')).length,work=ms.filter(m=>{const x=String(m.status||'').toLowerCase();return x.includes('процесс')||x.includes('работ')||x.includes('интеграц')||x.includes('тест')} ).length,high=ms.filter(m=>String(m.priority||'').toLowerCase().includes('выс')).length,inactive=ms.filter(m=>{const x=merchantInactivity(m);return x&&x.days>=14}).length,overdue=tasks.filter(t=>String(t.assignee||'').trim().toLowerCase()===manager.toLowerCase()&&!taskIsClosed(t)&&isOverdue(t.dueDate)).length;return{manager,total:ms.length,active,work,high,inactive,overdue};}).sort((a,b)=>b.total-a.total);
  };
  window.managerStatsPanel=function(){
    const rows=managerEffectivenessData();
    const cards=rows.map(r=>`<div class="manager-stat-card"><h4>${esc(r.manager)}</h4><div class="manager-stat-list"><div class="manager-stat-row"><span>${t('totalMerchants')}</span><b>${r.total}</b></div><div class="manager-stat-row"><span>${t('active')}</span><b>${r.active}</b></div><div class="manager-stat-row"><span>${t('workIntegration')}</span><b>${r.work}</b></div><div class="manager-stat-row"><span>${t('urgent')}</span><b>${r.high}</b></div><div class="manager-stat-row"><span>${t('noActivity14')}</span><b>${r.inactive}</b></div><div class="manager-stat-row"><span>${t('overdueTasks')}</span><b>${r.overdue}</b></div></div></div>`).join('');
    return `<section class="panel"><div class="panel-head"><h3>${t('managerStatistics')}</h3></div><div class="manager-stats-grid">${cards||emptyStateHtml()}</div></section>`;
  };

  const originalPartnerMerchants=window.partnerMerchants;
  window.partnerStats=function(p){const all=originalPartnerMerchants(p),list=all.filter(m=>spMerchantSectionOf(m)==='main'),potential=all.filter(m=>spMerchantSectionOf(m)==='potential').length,archived=all.filter(m=>spMerchantSectionOf(m)==='archive').length,active=list.filter(m=>String(m.status||'').toLowerCase().includes('актив')||String(m.status||'').toLowerCase().includes('фаъол')).length,contracts=list.filter(m=>m.contractNumber||m.contractDate).length,revenue=list.reduce((a,m)=>a+cleanNumber(m.revenue),0),invoices=list.reduce((a,m)=>a+cleanNumber(m.invoices),0);return{list,total:list.length,potential,archived,active,contracts,revenue,invoices,activeRate:list.length?Math.round(active/list.length*100):0};};

  document.addEventListener('DOMContentLoaded',spSyncMerchantSubmenu);
  setTimeout(spSyncMerchantSubmenu,50);
})();
</script>
