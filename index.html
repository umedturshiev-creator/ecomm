<script id="merchant-comments-v3102-script">
(function(){
  'use strict';

  const previousOpenTextModal = window.openTextModal;
  const previousQuickActionsHtml = window.quickActionsHtml;

  function commentUser(){
    const u = currentUser && currentUser();
    return String((u && (u.fio || u.login)) || 'Пользователь').trim() || 'Пользователь';
  }

  function merchantById(id){
    return (state.merchants || []).find(x => String(x.id) === String(id));
  }

  function commentDate(){
    return new Date().toLocaleString('ru-RU');
  }

  function archiveReasonHtml(m){
    if(!m || spMerchantSectionOf(m) !== 'archive' || !String(m.archiveReason || '').trim()) return '';
    return `<div class="merchant-comment-archive-note"><span>${state.lang === 'tj' ? 'Сабаби бойгонӣ' : 'Причина архивации'}</span><p>${esc(m.archiveReason)}</p></div>`;
  }

  function closeMerchantCommentsOverlay(){
    const overlay = document.getElementById('spMerchantCommentsOverlay');
    if(overlay) overlay.remove();
  }
  window.closeMerchantCommentsOverlay = closeMerchantCommentsOverlay;

  function showMerchantCommentsOverlay(innerHtml){
    closeMerchantCommentsOverlay();
    const overlay = document.createElement('div');
    overlay.id = 'spMerchantCommentsOverlay';
    overlay.className = 'merchant-comments-standalone-overlay';
    overlay.innerHTML = `<div class="merchant-comments-standalone-card">${innerHtml}</div>`;
    overlay.addEventListener('click', function(e){ if(e.target === overlay) closeMerchantCommentsOverlay(); });
    document.body.appendChild(overlay);
  }

  window.openMerchantCommentsManager = function(id, mode='view'){
    const m = merchantById(id);
    if(!m) return;
    const merchantName = esc(m.merchant || (state.lang === 'tj' ? 'Мерчант' : 'Мерчант'));
    const title = state.lang === 'tj' ? 'Шарҳҳои мерчант' : 'Комментарии мерчанта';
    const safeComment = String(m.comment || '').trim();
    const viewHtml = safeComment
      ? `<div class="merchant-comment-full">${esc(safeComment).replace(/\n/g,'<br>')}</div>`
      : `<div class="merchant-comment-empty">${state.lang === 'tj' ? 'Ҳоло ягон шарҳ нест' : 'Пока комментариев нет'}</div>`;

    if(mode === 'add'){
      showMerchantCommentsOverlay(`<div class="merchant-comment-manager">
        <div class="merchant-comment-manager-head"><div><h3>＋ ${state.lang === 'tj' ? 'Иловаи шарҳ' : 'Добавить комментарий'}</h3><p>${merchantName}</p></div><button class="modal-close" type="button" onclick="closeMerchantCommentsOverlay()">×</button></div>
        <div class="field"><label>${state.lang === 'tj' ? 'Шарҳи нав' : 'Новый комментарий'}</label><textarea name="merchantAdditionalComment" class="merchant-comment-edit-area" placeholder="${state.lang === 'tj' ? 'Матни шарҳро ворид кунед' : 'Введите текст комментария'}"></textarea></div>
        <div class="merchant-comment-help">${state.lang === 'tj' ? 'Шарҳи нав ба болои таърихча илова мешавад.' : 'Новый комментарий будет добавлен в начало истории.'}</div>
        <div class="modal-actions"><button class="btn ghost" type="button" onclick="openMerchantCommentsManager('${esc(id)}','view')">← ${state.lang === 'tj' ? 'Бозгашт' : 'Назад'}</button><button class="btn primary" type="button" onclick="saveAdditionalMerchantCommentV3102('${esc(id)}',this)">${state.lang === 'tj' ? 'Сабт кардан' : 'Сохранить'}</button></div>
      </div>`);
      setTimeout(()=>document.querySelector('#spMerchantCommentsOverlay [name="merchantAdditionalComment"]')?.focus(),80);
      return;
    }

    if(mode === 'edit'){
      showMerchantCommentsOverlay(`<div class="merchant-comment-manager">
        <div class="merchant-comment-manager-head"><div><h3>✏️ ${state.lang === 'tj' ? 'Таҳрири шарҳҳо' : 'Редактирование комментариев'}</h3><p>${merchantName}</p></div><button class="modal-close" type="button" onclick="closeMerchantCommentsOverlay()">×</button></div>
        <div class="field"><label>${state.lang === 'tj' ? 'Матни пурраи шарҳҳо' : 'Полный текст комментариев'}</label><textarea name="merchantCommentsEdit" class="merchant-comment-edit-area">${esc(safeComment)}</textarea></div>
        <div class="merchant-comment-help">${state.lang === 'tj' ? 'Метавонед матни пурраи шарҳҳоро таҳрир кунед ё комилан иваз намоед.' : 'Можно полностью отредактировать текст комментариев или заменить его.'}</div>
        <div class="modal-actions"><button class="btn ghost" type="button" onclick="openMerchantCommentsManager('${esc(id)}','view')">← ${state.lang === 'tj' ? 'Бозгашт' : 'Назад'}</button><button class="btn primary" type="button" onclick="saveEditedMerchantCommentsV3102('${esc(id)}',this)">${state.lang === 'tj' ? 'Сабт кардани тағйирот' : 'Сохранить изменения'}</button></div>
      </div>`);
      setTimeout(()=>document.querySelector('#spMerchantCommentsOverlay [name="merchantCommentsEdit"]')?.focus(),80);
      return;
    }

    showMerchantCommentsOverlay(`<div class="merchant-comment-manager">
      <div class="merchant-comment-manager-head"><div><h3>💬 ${title}</h3><p>${merchantName}</p></div><button class="modal-close" type="button" onclick="closeMerchantCommentsOverlay()">×</button></div>
      ${viewHtml}
      <div class="modal-actions"><button class="btn ghost comment-action-btn" type="button" onclick="openMerchantCommentsManager('${esc(id)}','edit')">✏️ ${state.lang === 'tj' ? 'Таҳрир' : 'Редактировать'}</button><button class="btn primary comment-action-btn" type="button" onclick="openMerchantCommentsManager('${esc(id)}','add')">＋ ${state.lang === 'tj' ? 'Илова кардан' : 'Добавить комментарий'}</button><button class="btn ghost" type="button" onclick="closeMerchantCommentsOverlay()">${state.lang === 'tj' ? 'Пӯшидан' : 'Закрыть'}</button></div>
    </div>`);
  };

  async function persistMerchantComments(id, comment, btn, successText){
    const m = merchantById(id);
    if(!m) return;
    try{
      setButtonLoading(btn, true, state.lang === 'tj' ? 'Сабт...' : 'Сохраняем...');
      showLoader(true);
      if(CONFIG.API_URL){
        await api('saveMerchant', {merchant:{id:String(id), comment:String(comment || ''), user:commentUser()}});
        await loadData();
      }else{
        m.comment = String(comment || '');
        m.updatedAt = new Date().toLocaleString('ru-RU');
        render();
      }
      successNotice(successText);
      closeModal();
      openMerchantCommentsManager(id, 'view');
    }catch(e){ toast(e.message || String(e)); }
    finally{ showLoader(false); setButtonLoading(btn, false); }
  }

  window.saveAdditionalMerchantCommentV3102 = async function(id, btn){
    const m = merchantById(id);
    const textarea = document.querySelector('#spMerchantCommentsOverlay [name="merchantAdditionalComment"]') || qs('#modalCard [name="merchantAdditionalComment"]');
    const value = String(textarea?.value || '').trim();
    if(!value){ toast(state.lang === 'tj' ? 'Матни шарҳро нависед' : 'Введите комментарий'); textarea?.focus(); return; }
    const entry = `${commentDate()} — ${commentUser()}: ${value}`;
    const current = String(m?.comment || '').trim();
    await persistMerchantComments(id, entry + (current ? '\n' + current : ''), btn, state.lang === 'tj' ? 'Шарҳ илова шуд' : 'Комментарий добавлен');
  };

  window.saveEditedMerchantCommentsV3102 = async function(id, btn){
    const m = merchantById(id);
    const textarea = document.querySelector('#spMerchantCommentsOverlay [name="merchantCommentsEdit"]') || qs('#modalCard [name="merchantCommentsEdit"]');
    const value = String(textarea?.value || '').trim();
    const oldValue = String(m?.comment || '').trim();
    if(!value && oldValue){
      const ok = window.confirm(state.lang === 'tj' ? 'Ҳамаи шарҳҳоро нест мекунед?' : 'Удалить все комментарии этого мерчанта?');
      if(!ok) return;
    }
    await persistMerchantComments(id, value, btn, state.lang === 'tj' ? 'Шарҳҳо тағйир ёфтанд' : 'Комментарии изменены');
  };

  // Перед стандартным обработчиком запоминаем ID мерчанта, по комментарию которого нажали.
  document.addEventListener('click', function(e){
    const btn = e.target.closest && e.target.closest('.js-open-text[data-label="comment"]');
    if(!btn) return;
    const holder = btn.closest('tr, article');
    const idNode = holder && holder.querySelector('[data-id]');
    window.__spCommentMerchantIdV3102 = String(btn.dataset.merchantId || idNode?.dataset.id || '');
  }, true);

  window.openTextModal = function(title, text, label='product'){
    if(label === 'comment'){
      let id = String(window.__spCommentMerchantIdV3102 || '');
      if(!id){
        const matches = (state.merchants || []).filter(m => String(m.merchant || '') === String(title || ''));
        if(matches.length === 1) id = String(matches[0].id || '');
      }
      window.__spCommentMerchantIdV3102 = '';
      if(id){ openMerchantCommentsManager(id, 'view'); return; }
    }
    return previousOpenTextModal(title, text, label);
  };

  window.quickActionsHtml = function(m){
    const base = previousQuickActionsHtml(m);
    const extra = `<button class="action-link" type="button" onclick="openMerchantCommentsManager('${esc(m.id || '')}','view')">📝 ${state.lang === 'tj' ? 'Идораи шарҳҳо' : 'Управление комментариями'}</button>`;
    return String(base || '').replace(/<\/div>\s*$/, extra + '</div>');
  };

  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && document.getElementById('spMerchantCommentsOverlay')) closeMerchantCommentsOverlay();
  });

  window.spMerchantRowActions = function(m, mobile=false){
    const section = spMerchantSectionOf(m), id = esc(m.id);
    if(mobile){
      if(section === 'archive') return `<div class="merchant-mobile-actions section-action"><button class="btn primary js-view-merchant" data-id="${id}">${state.lang === 'tj' ? 'Кушодан' : 'Открыть карточку'}</button><button class="btn ghost" onclick="openRestoreMerchantModal('${id}')">↩ ${state.lang === 'tj' ? 'Барқарор' : 'Восстановить'}</button></div>`;
      if(section === 'potential') return `<div class="merchant-mobile-actions three"><button class="btn primary js-view-merchant" data-id="${id}">${state.lang === 'tj' ? 'Кушодан' : 'Открыть карточку'}</button><button class="btn promote-action" onclick="openPromoteMerchantModal('${id}')">🚀 ${state.lang === 'tj' ? 'Ба кор' : 'В работу'}</button><button class="btn ghost js-new-task" data-id="${id}">✅ ${t('newTask')}</button></div>`;
      return `<div class="merchant-mobile-actions"><button class="btn primary js-view-merchant" data-id="${id}">${state.lang === 'tj' ? 'Кушодан' : 'Открыть карточку'}</button><button class="btn ghost js-new-task" data-id="${id}">✅ ${t('newTask')}</button></div>`;
    }
    if(section === 'potential') return `<button class="btn icon js-edit-merchant" data-tip="${t('edit')}" data-id="${id}">✏️</button> <button class="btn icon js-new-task" data-tip="${t('newTask')}" data-id="${id}">✅</button> <button class="btn icon promote-action" data-tip="В работу" onclick="openPromoteMerchantModal('${id}')">🚀</button>`;
    if(section === 'archive') return `<button class="btn icon js-view-merchant" data-tip="Открыть" data-id="${id}">👁</button> <button class="btn icon" data-tip="Восстановить" onclick="openRestoreMerchantModal('${id}')">↩</button>`;
    return `<button class="btn icon js-edit-merchant" data-tip="${t('edit')}" data-id="${id}">✏️</button> <button class="btn icon js-new-task" data-tip="${t('newTask')}" data-id="${id}">✅</button>`;
  };
})();
</script>

<script id="dashboard-settings-v3105-script">
(function(){
  'use strict';
  const PREF_KEY='sp_dashboard_prefs_v3104';
  const DEFAULT_VISIBLE={
    topCards:true,
    funnel:true,
    statusCharts:true,
    urgentMerchants:true,
    overdueTasks:true,
    kpi:true,
    today:true,
    managerStats:true
  };
  const LABELS={
    topCards:{ru:'Основные показатели',tj:'Нишондиҳандаҳои асосӣ'},
    funnel:{ru:'Воронка подключения мерчантов',tj:'Воронкаи пайвастшавӣ'},
    statusCharts:{ru:'Статусы, приоритеты и менеджеры',tj:'Ҳолатҳо, афзалиятҳо ва менеҷерҳо'},
    urgentMerchants:{ru:'Мерчанты — высокий приоритет',tj:'Мерчантҳо — афзалияти баланд'},
    overdueTasks:{ru:'Задачи — просрочено',tj:'Вазифаҳо — дермонда'},
    kpi:{ru:'KPI и отчёт',tj:'KPI ва ҳисобот'},
    today:{ru:'Сегодня',tj:'Имрӯз'},
    managerStats:{ru:'Статистика менеджеров',tj:'Омори менеҷерҳо'}
  };
  function lang(){return (window.state&&state.lang)||localStorage.getItem('sp_lang')||'ru';}
  function trLabel(key){const l=lang();return (LABELS[key]&&(LABELS[key][l]||LABELS[key].ru))||key;}
  function escHtml(v){
    if(typeof esc==='function') return esc(v);
    return String(v==null?'':v).replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function prefs(){
    const p={visible:{...DEFAULT_VISIBLE},collapsed:{}};
    try{
      const saved=JSON.parse(localStorage.getItem(PREF_KEY)||'{}');
      p.visible={...DEFAULT_VISIBLE,...(saved.visible||{})};
      p.collapsed={...(saved.collapsed||{})};
    }catch(e){}
    return p;
  }
  function savePrefs(p){try{localStorage.setItem(PREF_KEY,JSON.stringify(p));}catch(e){}}
  function isDashboard(){return window.state && state.view==='dashboard';}
  function root(){return document.getElementById('viewRoot');}
  function showToast(msg){try{if(typeof toast==='function')toast(msg);}catch(e){}}

  window.spGetDashboardPrefs=prefs;
  window.spSetDashboardVisible=function(key,value){
    const p=prefs();
    p.visible[key]=!!value;
    savePrefs(p);
    syncSettingsChecks();
    applyDashboardPersonalization(true);
    showToast(value ? (lang()==='tj'?'Блок фаъол шуд':'Блок включён') : (lang()==='tj'?'Блок пинҳон шуд':'Блок скрыт'));
  };
  window.spShowAllDashboardBlocks=function(){
    const p=prefs();
    p.visible={...DEFAULT_VISIBLE};
    savePrefs(p);
    syncSettingsChecks();
    applyDashboardPersonalization(true);
    if(isDashboard() && typeof renderDashboard==='function'){
      try{renderDashboard(); setTimeout(()=>applyDashboardPersonalization(true),0);}catch(e){}
    }
    showToast(lang()==='tj'?'Ҳамаи блокҳо фаъол шуданд':'Все блоки дашборда включены');
  };
  window.spToggleDashboardCollapse=function(key){
    const p=prefs();
    p.collapsed[key]=!p.collapsed[key];
    savePrefs(p);
    applyDashboardPersonalization(true);
  };
  window.spSetThemeFromSettings=function(theme){
    const next = theme==='dark'?'dark':'light';
    if(typeof applyTheme==='function') applyTheme(next);
    else{
      state.theme=next;
      try{window.state=state;localStorage.setItem('sp_theme',next);}catch(e){}
      document.documentElement.setAttribute('data-theme',next);
      if(document.body){
        document.body.setAttribute('data-theme',next);
        document.body.classList.toggle('dark-theme',next==='dark');
      }
    }
    if(typeof renderSettings==='function') renderSettings();
    setTimeout(()=>{try{ if(typeof applyTheme==='function') applyTheme(next); }catch(e){}},0);
  };
  window.spSetLangFromSettings=function(value){
    if(typeof setAppLang==='function') setAppLang(value==='tj'?'tj':'ru');
  };

  function getDashboardBlocks(){
    const r=root();
    if(!r) return {};
    const children=[...r.children];
    const cards=children.find(x=>x.classList&&x.classList.contains('cards'))||null;
    const panels=[...r.querySelectorAll(':scope > .panel')];
    const mini=children.find(x=>x.classList&&x.classList.contains('mini-charts'))||null;
    const grid2=children.find(x=>x.classList&&x.classList.contains('grid2'))||null;
    const gridPanels=grid2?[...grid2.children].filter(x=>x.classList&&x.classList.contains('panel')):[];
    const panelByTitle=(words)=>panels.find(p=>words.some(w=>String(p.textContent||'').toLowerCase().includes(w.toLowerCase())))||null;
    return {
      topCards:cards,
      funnel:panels[0]||panelByTitle(['воронка','Воронка','пайвастшавӣ']),
      statusCharts:mini,
      urgentMerchants:gridPanels[0]||panelByTitle(['высокий приоритет','афзалияти баланд']),
      overdueTasks:gridPanels[1]||panelByTitle(['просрочено','дермонда']),
      kpi:panelByTitle(['KPI','kpi']),
      today:panelByTitle(['Сегодня','Имрӯз']),
      managerStats:panelByTitle(['Статистика менеджеров','Омори менеҷерҳо'])
    };
  }
  function blockTitle(el,key){
    const h=el&&el.querySelector&&el.querySelector('.panel-head h3, h3');
    return (h&&h.textContent&&h.textContent.trim())||trLabel(key);
  }
  function makeCollapseButton(key){
    const p=prefs();
    const collapsed=!!p.collapsed[key];
    const b=document.createElement('button');
    b.type='button';
    b.className='sp-dashboard-collapse-btn';
    b.dataset.dashboardCollapseKey=key;
    b.title=collapsed?(lang()==='tj'?'Намоиш':'Показать'):(lang()==='tj'?'Пинҳон':'Скрыть');
    b.setAttribute('aria-label',b.title);
    b.textContent=collapsed?'⌄':'⌃';
    b.onclick=function(ev){ev.preventDefault();ev.stopPropagation();window.spToggleDashboardCollapse(key);};
    return b;
  }
  function decorateBlock(el,key){
    if(!el) return;
    const p=prefs();
    el.classList.add('sp-dashboard-block');
    el.dataset.dashboardBlockKey=key;
    el.classList.toggle('sp-dashboard-hidden',p.visible[key]===false);
    el.classList.toggle('sp-dash-collapsed',!!p.collapsed[key]);
    el.querySelectorAll(':scope > .sp-dashboard-collapse-btn').forEach(x=>x.remove());
    const head=el.querySelector(':scope > .panel-head');
    if(head){
      head.querySelectorAll('.sp-dashboard-collapse-btn').forEach(x=>x.remove());
      head.appendChild(makeCollapseButton(key));
    }else{
      el.appendChild(makeCollapseButton(key));
    }
    el.setAttribute('data-dashboard-title',blockTitle(el,key));
  }
  window.applyDashboardPersonalization=function(force){
    if(!force && !isDashboard()) return;
    const r=root();
    if(!r) return;
    r.dataset.view=(window.state&&state.view)||'';
    const blocks=getDashboardBlocks();
    Object.keys(DEFAULT_VISIBLE).forEach(key=>decorateBlock(blocks[key],key));
  };
  function syncSettingsChecks(){
    const p=prefs();
    document.querySelectorAll('[data-dashboard-setting-key]').forEach(input=>{
      const k=input.getAttribute('data-dashboard-setting-key');
      input.checked=p.visible[k]!==false;
    });
  }
  function checkCard(key){
    const p=prefs();
    const checked=p.visible[key]!==false?'checked':'';
    return `<label class="sp-dashboard-check"><input type="checkbox" data-dashboard-setting-key="${key}" ${checked} onchange="spSetDashboardVisible('${key}',this.checked)"><span>${escHtml(trLabel(key))}</span></label>`;
  }
  function appearanceHtml(){
    const l=lang();
    const isDark=(window.state&&state.theme?state.theme:localStorage.getItem('sp_theme')||'light')==='dark';
    return `<div class="sp-settings-section" id="personalUiSettings">
      <div class="settings-card" style="grid-column:1/-1">
        <h4>🎛 ${l==='tj'?'Намуди барнома':'Внешний вид'}</h4>
        <p class="settings-note">${l==='tj'?'Забон ва мавзӯъ дар ин ҷо ҷойгир шуданд.':'Язык и тема перенесены сюда, чтобы верхняя панель была чище.'}</p>
        <div class="sp-settings-appearance">
          <div class="sp-setting-control-card"><h5>${l==='tj'?'Забон':'Язык'}</h5><div class="sp-settings-segment"><button type="button" class="sp-settings-option ${l==='tj'?'active':''}" onclick="spSetLangFromSettings('tj')">Тоҷикӣ</button><button type="button" class="sp-settings-option ${l==='ru'?'active':''}" onclick="spSetLangFromSettings('ru')">Русский</button></div></div>
          <div class="sp-setting-control-card"><h5>${l==='tj'?'Мавзӯъ':'Тема'}</h5><div class="sp-settings-segment"><button type="button" class="sp-settings-option ${!isDark?'active':''}" onclick="spSetThemeFromSettings('light')">☀️ ${l==='tj'?'Равшан':'Светлая'}</button><button type="button" class="sp-settings-option ${isDark?'active':''}" onclick="spSetThemeFromSettings('dark')">🌙 ${l==='tj'?'Торик':'Тёмная'}</button></div></div>
        </div>
      </div>
      <div class="settings-card" style="grid-column:1/-1">
        <div class="sp-dashboard-settings-head"><div><h4>📊 ${l==='tj'?'Намоиши дашборд':'Отображение дашборда'}</h4><p>${l==='tj'?'Интихоб кунед, ки кадом блокҳо дар дашборд намоиш дода шаванд.':'Выберите, какие блоки должны отображаться во вкладке «Дашборд». Настройки сохраняются отдельно для вашего профиля.'}</p></div><button type="button" class="btn ghost" onclick="spShowAllDashboardBlocks()">${l==='tj'?'Ҳамаро нишон додан':'Показывать всё'}</button></div>
        <div class="sp-dashboard-settings-groups">
          <div class="sp-dashboard-settings-group"><h5>${l==='tj'?'Асосӣ':'Основные показатели'}</h5><div class="sp-dashboard-check-grid">${checkCard('topCards')}${checkCard('funnel')}${checkCard('kpi')}${checkCard('today')}</div></div>
          <div class="sp-dashboard-settings-group"><h5>${l==='tj'?'Графика ва таҳлил':'Графики и аналитика'}</h5><div class="sp-dashboard-check-grid">${checkCard('statusCharts')}${checkCard('managerStats')}</div></div>
          <div class="sp-dashboard-settings-group"><h5>${l==='tj'?'Тафсилот':'Детализация'}</h5><div class="sp-dashboard-check-grid">${checkCard('urgentMerchants')}${checkCard('overdueTasks')}</div></div>
        </div>
      </div>
    </div>`;
  }
  function injectSettings(){
    const grid=document.querySelector('#viewRoot .settings-grid');
    if(!grid) return;
    const old=document.getElementById('personalUiSettings');
    if(old) old.remove();
    grid.insertAdjacentHTML('afterbegin',appearanceHtml());
    syncSettingsChecks();
  }
  const originalRenderSettings=window.renderSettings;
  if(typeof originalRenderSettings==='function'){
    window.renderSettings=function(){
      originalRenderSettings.apply(this,arguments);
      setTimeout(injectSettings,0);
    };
  }
  const originalRenderDashboard=window.renderDashboard;
  if(typeof originalRenderDashboard==='function'){
    window.renderDashboard=function(){
      originalRenderDashboard.apply(this,arguments);
      setTimeout(()=>applyDashboardPersonalization(true),0);
    };
  }
  function installObserver(){
    const r=root();
    if(!r || r.__spDashboardObserver) return;
    const mo=new MutationObserver(()=>{
      if(isDashboard()) requestAnimationFrame(()=>applyDashboardPersonalization(true));
      if(window.state&&state.view==='settings') requestAnimationFrame(injectSettings);
    });
    mo.observe(r,{childList:true,subtree:false});
    r.__spDashboardObserver=mo;
  }
  document.addEventListener('DOMContentLoaded',function(){
    installObserver();
    const version=document.querySelector('.app-version');
    if(version) version.textContent='v3.10.45 SMART';
    setTimeout(()=>{installObserver();applyDashboardPersonalization(true);injectSettings();},250);
  });
  setTimeout(()=>{installObserver();applyDashboardPersonalization(true);injectSettings();},600);
})();
</script>

<script id="sp-manager-stat-click-filters-v31039">
(function(){
  function spMgrNorm(v){return String(v||'').trim().toLowerCase();}
  function spMgrLabel(key,fallback){
    try{const v=typeof t==='function'?t(key):'';return v&&v!==key?v:fallback;}catch(e){return fallback;}
  }
  function spMgrEsc(v){try{return esc(v)}catch(e){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}}
  function spMgrBaseMerchants(){
    try{if(typeof spOperationalMerchants==='function')return spOperationalMerchants()||[];}catch(e){}
    return (window.state&&Array.isArray(state.merchants))?state.merchants:[];
  }
  function spMgrBaseTasks(){
    try{if(typeof spOperationalTasks==='function')return spOperationalTasks()||[];}catch(e){}
    return (window.state&&Array.isArray(state.tasks))?state.tasks:[];
  }
  function spMgrIsReal(name){
    const n=spMgrNorm(name);
    if(!n)return false;
    if(['не назначен','без менеджера','не указано','все','команда','undefined','null'].includes(n))return false;
    try{return typeof isRealManager==='function'?isRealManager(name):true;}catch(e){return true;}
  }
  function spMgrStatus(m){return String(m&&m.status||'').toLowerCase();}
  function spMgrPriority(m){return String(m&&m.priority||'').toLowerCase();}
  function spMgrInactive(m){try{const x=merchantInactivity(m);return x&&Number(x.days)>=14;}catch(e){return false;}}
  function spMgrTaskClosed(t){try{return taskIsClosed(t);}catch(e){return ['done','closed','completed','выполнено','закрыта','закрыто','архив'].includes(spMgrNorm(t&&t.status));}}
  function spMgrTaskOverdue(t){try{return isOverdue(t&&t.dueDate);}catch(e){const d=new Date(t&&t.dueDate);if(isNaN(d))return false;const today=new Date();today.setHours(0,0,0,0);d.setHours(0,0,0,0);return d<today;}}
  function spMgrLists(manager){
    const name=String(manager||'').trim();
    const lower=spMgrNorm(name);
    const merchants=spMgrBaseMerchants().filter(m=>spMgrNorm(m&&m.manager)===lower);
    const tasks=spMgrBaseTasks().filter(t=>spMgrNorm(t&&t.assignee)===lower);
    return {
      all:merchants,
      active:merchants.filter(m=>{const s=spMgrStatus(m);return s.includes('актив')||s.includes('фаъол')||s==='active';}),
      work:merchants.filter(m=>{const s=spMgrStatus(m);return s.includes('процесс')||s.includes('работ')||s.includes('интеграц')||s.includes('тест')||s.includes('ҳамгир')||s.includes('санҷ');}),
      high:merchants.filter(m=>{const p=spMgrPriority(m);return p.includes('выс')||p.includes('баланд')||p.includes('high');}),
      inactive:merchants.filter(spMgrInactive),
      overdueTasks:tasks.filter(t=>!spMgrTaskClosed(t)&&spMgrTaskOverdue(t))
    };
  }
  function spMgrRows(){
    const base=spMgrBaseMerchants();
    const names=[...new Set(base.map(m=>String(m&&m.manager||'').trim()).filter(spMgrIsReal))].sort((a,b)=>a.localeCompare(b,'ru'));
    return names.map(manager=>{const l=spMgrLists(manager);return {manager,total:l.all.length,active:l.active.length,work:l.work.length,high:l.high.length,inactive:l.inactive.length,overdue:l.overdueTasks.length};}).sort((a,b)=>b.total-a.total||a.manager.localeCompare(b.manager,'ru'));
  }
  function spMgrTitle(manager,type){
    const labels={
      all:spMgrLabel('totalMerchants','Всего мерчантов'),
      active:spMgrLabel('active','Активные'),
      work:spMgrLabel('workIntegration','В работе / интеграции'),
      high:spMgrLabel('urgent','Высокий приоритет'),
      inactive:spMgrLabel('noActivity14','Нет активности 14+'),
      overdueTasks:spMgrLabel('overdueTasks','Просроченные задачи')
    };
    return `${manager} — ${labels[type]||labels.all}`;
  }
  function spMgrClearFilters(){
    if(!window.state)return;
    state.filterText='';state.filterStatus='';state.funnelStageFilter='';state.contractFilter='';state.filterBusinessType='';state.filterManager='';state.filterPartner='';state.incompleteFilter='';state.inactivityFilter='';state.periodFilter='';
    state.taskQuickFilter='';state.taskTodayFilter='';
  }
  window.renderManagerMerchantList_v31039=function(title,list){
    const root=document.getElementById('viewRoot');
    if(!root)return;
    const table=typeof merchantTable==='function'?merchantTable(list||[]):((list||[]).length?'<pre>'+spMgrEsc(JSON.stringify(list,null,2))+'</pre>':(typeof emptyStateHtml==='function'?emptyStateHtml():''));
    root.innerHTML=`<section class="panel merchants-panel sp-manager-filter-result"><div class="panel-head"><div><h3>${spMgrEsc(title)}</h3><div class="chart-note">Фильтр: менеджер + выбранный показатель</div></div><div class="actions"><button class="btn ghost" type="button" onclick="setView('dashboard')">Назад к дашборду</button><button class="btn ghost" type="button" onclick="renderMerchants()">Все мерчанты</button></div></div>${table}</section>`;
  };
  window.renderManagerTaskList_v31039=function(title,list){
    const root=document.getElementById('viewRoot');
    if(!root)return;
    const table=typeof taskTable==='function'?taskTable(list||[]):((list||[]).length?'<pre>'+spMgrEsc(JSON.stringify(list,null,2))+'</pre>':(typeof emptyStateHtml==='function'?emptyStateHtml():''));
    root.innerHTML=`<section class="panel sp-manager-filter-result"><div class="panel-head"><div><h3>${spMgrEsc(title)}</h3><div class="chart-note">Фильтр: менеджер + просроченные задачи</div></div><div class="actions"><button class="btn ghost" type="button" onclick="setView('dashboard')">Назад к дашборду</button><button class="btn ghost" type="button" onclick="renderTasks()">Все задачи</button></div></div>${table}</section>`;
  };
  window.openManagerStatFilter_v31039=function(encodedManager,type){
    const manager=decodeURIComponent(String(encodedManager||'')).trim();
    const kind=String(type||'all');
    const lists=spMgrLists(manager);
    spMgrClearFilters();
    if(kind==='overdueTasks'){
      if(window.state){state.taskTab='active';state.view='tasks';}
      try{setView('tasks');}catch(e){}
      window.renderManagerTaskList_v31039(spMgrTitle(manager,kind),lists.overdueTasks||[]);
      return false;
    }
    if(window.state){state.merchantSection='main';state.view='merchants';state._tempMerchantList=lists[kind]||lists.all||[];}
    try{setView('merchants',{section:'main'});}catch(e){}
    window.renderManagerMerchantList_v31039(spMgrTitle(manager,kind),lists[kind]||lists.all||[]);
    return false;
  };
  window.openManagerStatFilter=function(manager,type){return window.openManagerStatFilter_v31039(encodeURIComponent(String(manager||'')),type);};
  window.managerStatsPanel=function(){
    const rows=spMgrRows();
    const labelTotal=spMgrLabel('totalMerchants','Всего мерчантов'),labelActive=spMgrLabel('active','Активные'),labelWork=spMgrLabel('workIntegration','В работе / интеграции'),labelHigh=spMgrLabel('urgent','Высокий приоритет'),labelInactive=spMgrLabel('noActivity14','Нет активности 14+'),labelOverdue=spMgrLabel('overdueTasks','Просроченные задачи');
    const cards=rows.map(r=>{
      const enc=encodeURIComponent(r.manager);
      const click=(type)=>`onclick="return window.openManagerStatFilter_v31039('${enc}','${type}')"`;
      return `<div class="manager-stat-card sp-manager-click-card"><h4 class="sp-manager-click-title" ${click('all')} title="Открыть всех мерчантов менеджера">${spMgrEsc(r.manager)}</h4><div class="manager-stat-list"><div class="manager-stat-row sp-manager-stat-click" ${click('all')}><span>${labelTotal}</span><b>${r.total}</b></div><div class="manager-stat-row sp-manager-stat-click" ${click('active')}><span>${labelActive}</span><b>${r.active}</b></div><div class="manager-stat-row sp-manager-stat-click" ${click('work')}><span>${labelWork}</span><b>${r.work}</b></div><div class="manager-stat-row sp-manager-stat-click" ${click('high')}><span>${labelHigh}</span><b>${r.high}</b></div><div class="manager-stat-row sp-manager-stat-click" ${click('inactive')}><span>${labelInactive}</span><b>${r.inactive}</b></div><div class="manager-stat-row sp-manager-stat-click" ${click('overdueTasks')}><span>${labelOverdue}</span><b>${r.overdue}</b></div></div></div>`;
    }).join('');
    return `<section class="panel"><div class="panel-head"><h3>${spMgrLabel('managerStatistics','Статистика по менеджерам')}</h3><span class="chart-note">Нажмите на любой показатель, чтобы открыть список именно этого менеджера</span></div><div class="manager-stats-grid">${cards||(typeof emptyStateHtml==='function'?emptyStateHtml():'')}</div></section>`;
  };
})();
</script>

    function applySavedTheme(){
      var theme = (localStorage.getItem('sp_theme') || (window.state&&window.state.theme) || 'light') === 'dark' ? 'dark' : 'light';
      if(window.state) window.state.theme = theme;
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.classList.toggle('dark-theme', theme === 'dark');
      if(document.body){
        document.body.setAttribute('data-theme', theme);
        document.body.classList.toggle('dark-theme', theme === 'dark');
      }
    }
    applySavedTheme();
    document.addEventListener('DOMContentLoaded', applySavedTheme);
    window.addEventListener('storage', function(e){ if(e.key==='sp_theme') applySavedTheme(); });
  }catch(e){}
})();
</script>

<script id="sp-merchant-sort-filters-v31059-script">
(function(){
  function readStore(key,fallback){
    try{const v=localStorage.getItem(key);return v==null?fallback:v}catch(e){return fallback}
  }
  function writeStore(key,value){try{localStorage.setItem(key,String(value))}catch(e){}}

  state.merchantFiltersCollapsed = state.merchantFiltersCollapsed ?? (readStore('sp_merchant_filters_collapsed','0')==='1');
  state.merchantSortKey = state.merchantSortKey || readStore('sp_merchant_sort_key','default') || 'default';
  state.merchantSortDir = state.merchantSortDir || readStore('sp_merchant_sort_dir','asc') || 'asc';

  function compareText(a,b){
    return String(a||'').trim().localeCompare(String(b||'').trim(),'ru',{sensitivity:'base',numeric:true});
  }
  function merchantContractTime(m){
    const d=typeof parseAnyDate==='function'?parseAnyDate(m?.contractDate):null;
    return d && !isNaN(d) ? d.getTime() : null;
  }
  function defaultMerchantSort(list){
    return [...list].sort((a,b)=>{
      const sw=statusSortWeight(a.status)-statusSortWeight(b.status);if(sw)return sw;
      const pw=prioritySortWeight(a.priority)-prioritySortWeight(b.priority);if(pw)return pw;
      return compareText(a.merchant,b.merchant);
    });
  }

  window.sortMerchants=function(list){
    const key=state.merchantSortKey||'default';
    if(key==='default')return defaultMerchantSort(list||[]);
    const dir=state.merchantSortDir==='desc'?-1:1;
    return [...(list||[])].sort((a,b)=>{
      let result=0;
      if(key==='merchant') result=compareText(a.merchant,b.merchant);
      else if(key==='city') result=compareText(a.city,b.city);
      else if(key==='manager') result=compareText(a.manager,b.manager);
      else if(key==='status') result=statusSortWeight(a.status)-statusSortWeight(b.status)||compareText(a.status,b.status);
      else if(key==='priority') result=prioritySortWeight(a.priority)-prioritySortWeight(b.priority);
      else if(key==='contract'){
        const at=merchantContractTime(a),bt=merchantContractTime(b);
        if(at==null&&bt==null)result=0;
        else if(at==null)return 1;
        else if(bt==null)return -1;
        else result=at-bt;
      }
      if(result===0)result=compareText(a.merchant,b.merchant);
      return result*dir;
    });
  };

  function sortPresetValue(){return state.merchantSortKey==='default'?'default':`${state.merchantSortKey}-${state.merchantSortDir}`}
  function sortLabel(){
    const key=state.merchantSortKey||'default',dir=state.merchantSortDir||'asc';
    const labels={
      default:'Сортировка: по умолчанию',
      merchant:dir==='asc'?'Мерчант: А → Я':'Мерчант: Я → А',
      city:dir==='asc'?'Город: А → Я':'Город: Я → А',
      manager:dir==='asc'?'Менеджер: А → Я':'Менеджер: Я → А',
      status:dir==='asc'?'Статус: по этапам':'Статус: обратно',
      priority:dir==='asc'?'Приоритет: высокий → низкий':'Приоритет: низкий → высокий',
      contract:dir==='desc'?'Договор: сначала новые':'Договор: сначала старые'
    };
    return labels[key]||labels.default;
  }
  function activeFilterCount(){
    return ['filterText','filterStatus','funnelStageFilter','contractFilter','filterBusinessType','filterManager','filterPartner','incompleteFilter','inactivityFilter','periodFilter']
      .reduce((n,key)=>n+(String(state[key]||'').trim()?1:0),0);
  }
  function updateMerchantHost(){
    const list=sortMerchants(getFilteredMerchants());
    const host=qs('#merchantTableHost');if(host)host.innerHTML=merchantTable(list);
    const count=qs('#merchantVisibleCount');if(count)count.textContent=String(list.length);
    const sort=qs('#merchantSortSelect');if(sort)sort.value=sortPresetValue();
  }

  window.spSetMerchantSort=function(key){
    key=String(key||'default');
    if(key==='default'){
      state.merchantSortKey='default';state.merchantSortDir='asc';
    }else if(state.merchantSortKey===key){
      state.merchantSortDir=state.merchantSortDir==='asc'?'desc':'asc';
    }else{
      state.merchantSortKey=key;
      state.merchantSortDir=key==='contract'?'desc':'asc';
    }
    writeStore('sp_merchant_sort_key',state.merchantSortKey);
    writeStore('sp_merchant_sort_dir',state.merchantSortDir);
    updateMerchantHost();
  };
  window.spSetMerchantSortPreset=function(value){
    value=String(value||'default');
    if(value==='default'){state.merchantSortKey='default';state.merchantSortDir='asc'}
    else{
      const idx=value.lastIndexOf('-');
      state.merchantSortKey=value.slice(0,idx)||'default';
      state.merchantSortDir=value.slice(idx+1)==='desc'?'desc':'asc';
    }
    writeStore('sp_merchant_sort_key',state.merchantSortKey);
    writeStore('sp_merchant_sort_dir',state.merchantSortDir);
    updateMerchantHost();
  };
  window.spToggleMerchantFilters=function(){
    state.merchantFiltersCollapsed=!state.merchantFiltersCollapsed;
    writeStore('sp_merchant_filters_collapsed',state.merchantFiltersCollapsed?'1':'0');
    renderMerchants();
  };
  window.setMerchantPeriodFilter=function(period){
    state.periodFilter=state.periodFilter===period?'':period;
    renderMerchants();
    if(state.periodFilter)toast(period==='today'?'Период: сегодня':period==='week'?'Период: последние 7 дней':'Период: последний месяц');
  };
  window.handleMerchantSearch=function(value){state.filterText=value;updateMerchantHost()};
  window.renderMerchantTableHost=updateMerchantHost;

  window.getFilteredMerchants=function(){
    const text=String(state.filterText||'').toLowerCase();
    let periodStart=null;
    if(state.periodFilter){
      const now=new Date();periodStart=new Date(now);
      if(state.periodFilter==='today')periodStart.setHours(0,0,0,0);
      else if(state.periodFilter==='week')periodStart.setDate(now.getDate()-7);
      else if(state.periodFilter==='month')periodStart.setMonth(now.getMonth()-1);
    }
    return spMerchantsBySection(state.merchantSection||'main').filter(m=>{
      const byStatus=merchantMatchesStatusFilter(m,state.filterStatus);
      const byFunnel=!state.funnelStageFilter||merchantFunnelStage(m)===state.funnelStageFilter;
      const hasContract=!!(m.contractNumber||m.contractDate);
      const byContract=!state.contractFilter||(state.contractFilter==='with'?hasContract:!hasContract);
      const byBusiness=!state.filterBusinessType||normalizeFilterValue(m.businessType)===normalizeFilterValue(state.filterBusinessType);
      const hay=[m.merchant,m.inn,m.city,m.businessType,m.manager,canAccessPartners()?m.partnerName:'',m.product,m.comment,m.contractNumber,m.contractDate,m.contractRate,m.phone,m.contactName,m.archiveReason].join(' ').toLowerCase();
      const byIncomplete=!state.incompleteFilter||merchantIsIncomplete(m,state.incompleteFilter);
      const byManager=!state.filterManager||String(m.manager||'').trim()===state.filterManager;
      const byPartner=!canAccessPartners()||!state.filterPartner||(state.filterPartner==='__none__'?!String(m.partnerId||'').trim():state.filterPartner==='__all_partner__'?!!String(m.partnerId||'').trim():String(m.partnerId||'')===String(state.filterPartner));
      const byInactivity=!state.inactivityFilter||(merchantInactivity(m)&&merchantInactivity(m).days>=Number(state.inactivityFilter));
      let byPeriod=true;
      if(periodStart){
        const d=parseAnyDate(m.createdAt||m.date||m.contractDate||m.nextDate);
        byPeriod=!!(d&&!isNaN(d)&&d>=periodStart&&d<=new Date());
      }
      return byStatus&&byFunnel&&byContract&&byBusiness&&byManager&&byPartner&&byIncomplete&&byInactivity&&byPeriod&&(!text||hay.includes(text));
    });
  };

  function sortableHeader(label,key,compact){
    if(compact)return `<th>${label}</th>`;
    const active=state.merchantSortKey===key;
    const icon=active?(state.merchantSortDir==='asc'?'↑':'↓'):'↕';
    const title=key==='contract'?'Сортировать по дате заключения договора':key==='priority'?'Сортировать по приоритету':'Сортировать столбец';
    return `<th><button type="button" class="merchant-sort-header ${active?'is-active':''}" onclick="spSetMerchantSort('${key}')" title="${title}"><span>${label}</span><span class="merchant-sort-icon">${icon}</span></button></th>`;
  }

  window.merchantFilters=function(){
    const section=state.merchantSection||'main';
    const mainStatuses=['','В процессе','В работе','Ожидает документы','Договор','Интеграция','Тест','На интеграции и тест','Активный','Проблемный','Заморожен'];
    const potentialStatuses=['','Потенциальный','Новый','Нет ответа'];
    const archiveStatuses=['',...new Set(spMerchantsBySection('archive').map(m=>String(m.status||'').trim()).filter(Boolean))];
    const statuses=section==='potential'?potentialStatuses:section==='archive'?archiveStatuses:mainStatuses;
    const partnerFilter=canAccessPartners()?`<select onchange="state.filterPartner=this.value;renderMerchants()"><option value="">${state.lang==='tj'?'Ҳамаи шарикон':'Все партнеры'}</option><option value="__all_partner__" ${state.filterPartner==='__all_partner__'?'selected':''}>${state.lang==='tj'?'Ҳамаи мерчантҳои шарикӣ':'Все партнерские мерчанты'}</option><option value="__none__" ${state.filterPartner==='__none__'?'selected':''}>${state.lang==='tj'?'Бе шарик':'Без партнера'}</option>${(state.partners||[]).map(p=>`<option value="${esc(p.id)}" ${p.id===state.filterPartner?'selected':''}>${esc(p.partnerName||p.legalName||'')}</option>`).join('')}</select>`:'';
    const extras=section==='archive'?'':`${section==='main'?funnelFilterBanner():''}${incompleteFiltersHtml()}${section==='main'?inactivityFiltersHtml():''}`;
    const count=activeFilterCount(),visible=getFilteredMerchants().length;
    return `<div class="merchant-filter-box ${state.merchantFiltersCollapsed?'is-collapsed':''}">
      <div class="merchant-filter-summary">
        <button class="merchant-filter-toggle" type="button" onclick="spToggleMerchantFilters()"><span class="merchant-filter-toggle-icon">⚙️</span><span>${state.lang==='tj'?'Филтрҳо':'Фильтры'}</span>${count?`<span class="merchant-filter-count">${count}</span>`:''}<span class="merchant-filter-toggle-arrow">⌃</span></button>
        <div class="merchant-filter-meta"><span class="merchant-result-count">${state.lang==='tj'?'Намоиш дода шуд':'Показано'}: <b id="merchantVisibleCount">${visible}</b></span>
          <select id="merchantSortSelect" class="merchant-sort-select" onchange="spSetMerchantSortPreset(this.value)" title="Сортировка списка">
            <option value="default" ${sortPresetValue()==='default'?'selected':''}>Сортировка: по умолчанию</option>
            <option value="merchant-asc" ${sortPresetValue()==='merchant-asc'?'selected':''}>Мерчант: А → Я</option><option value="merchant-desc" ${sortPresetValue()==='merchant-desc'?'selected':''}>Мерчант: Я → А</option>
            <option value="contract-desc" ${sortPresetValue()==='contract-desc'?'selected':''}>Договор: сначала новые</option><option value="contract-asc" ${sortPresetValue()==='contract-asc'?'selected':''}>Договор: сначала старые</option>
            <option value="priority-asc" ${sortPresetValue()==='priority-asc'?'selected':''}>Приоритет: высокий → низкий</option><option value="priority-desc" ${sortPresetValue()==='priority-desc'?'selected':''}>Приоритет: низкий → высокий</option>
          </select>
        </div>
      </div>
      <div class="merchant-filter-body">
        <div class="filters"><input id="searchInput" placeholder="${state.lang==='tj'?'Ҷустуҷӯ: мерчант, РМА, шаҳр...':'Поиск: мерчант, ИНН, город...'}" value="${esc(state.filterText)}" oninput="handleMerchantSearch(this.value)"><select onchange="state.filterStatus=this.value;renderMerchants()">${statuses.map(s=>`<option value="${esc(s)}" ${s===state.filterStatus?'selected':''}>${s?tr(s):t('allStatuses')}</option>`).join('')}</select><select onchange="state.filterBusinessType=this.value;renderMerchants()"><option value="">${t('allBusinessTypes')}</option>${uniqueBusinessTypes().map(bt=>`<option value="${esc(bt)}" ${bt===state.filterBusinessType?'selected':''}>${esc(tr(bt))}</option>`).join('')}</select><select onchange="state.filterManager=this.value;renderMerchants()"><option value="">${state.lang==='tj'?'Ҳамаи менеҷерҳо':'Все менеджеры'}</option>${uniqueManagers().map(m=>`<option value="${esc(m)}" ${m===state.filterManager?'selected':''}>${esc(m)}</option>`).join('')}</select>${partnerFilter}</div>
        <div class="filter-toolbar"><button class="clear-filters-btn" type="button" onclick="clearMerchantFilters()">✕ Очистить фильтры</button><button class="period-btn ${state.periodFilter==='today'?'active':''}" type="button" onclick="setMerchantPeriodFilter('today')">Сегодня</button><button class="period-btn ${state.periodFilter==='week'?'active':''}" type="button" onclick="setMerchantPeriodFilter('week')">Неделя</button><button class="period-btn ${state.periodFilter==='month'?'active':''}" type="button" onclick="setMerchantPeriodFilter('month')">Месяц</button></div>${extras}
      </div>
    </div>`;
  };

  window.merchantTable=function(list,compact=false){
    if(!list||!list.length)return `<div class="empty-state"><div class="empty-icon">📭</div><h3>${state.merchantSection==='potential'?'Потенциальных мерчантов пока нет':state.merchantSection==='archive'?'Архив пуст':'Нет данных'}</h3><p>${state.merchantSection==='potential'?'Добавляйте новые лиды сюда — они не повлияют на аналитику.':state.merchantSection==='archive'?'Здесь появятся мерчанты, которых вы перенесёте в архив.':'По выбранному фильтру ничего не найдено.<br>Попробуйте изменить фильтр или очистить поиск.'}</p></div>`;
    const q=String(state.filterText||'').trim(),mark=v=>highlightText(tr(v||''),q);
    const mobileCards=`<div class="merchant-mobile-list">${list.map(m=>`<article class="merchant-mobile-card ${rowPriorityClass(m.priority)}"><div class="merchant-mobile-top">${merchantLogo(m,'mini')}<div class="merchant-mobile-title"><b>${mark(m.merchant)}</b><small>${mark(m.businessType||'')} · ${mark(m.city||'')}</small></div><button class="merchant-mobile-edit js-edit-merchant" data-tip="${t('edit')}" data-id="${esc(m.id)}" aria-label="${t('edit')}">✏️</button></div><div class="merchant-mobile-badges">${spSectionChip(m)}<span class="status ${statusClass(m.status)}">${esc(tr(m.status||'—'))}</span><span class="merchant-mobile-priority ${priorityClass(m.priority)}">${esc(tr(m.priority||'—'))}</span>${m.contractNumber||m.contractDate||m.contractPdfUrl?mobileContractBadge(m):`<span class="merchant-mobile-contract muted">📄 ${t('withoutContract')}</span>`}</div><div class="merchant-mobile-line"><span>${t('manager')}</span><b>${mark(m.manager||'—')}</b></div>${canAccessPartners()&&m.partnerName?`<div class="merchant-mobile-line"><span>${state.lang==='tj'?'Шарик':'Партнер'}</span><b>${mark(m.partnerName)}</b></div>`:''}${m.phone?`<div class="merchant-mobile-line"><span>${t('phone')}</span><b>${mark(m.phone||'')}</b></div>`:''}${spMerchantSectionOf(m)==='archive'&&m.archiveReason?`<div class="archive-reason-preview">▣ ${mark(m.archiveReason)}</div>`:''}${spMerchantCommentText(m)?`<button type="button" class="merchant-mobile-comment js-open-text" data-label="comment" data-title="${esc(m.merchant)}" data-text="${esc(spMerchantCommentText(m))}"><span class="merchant-mobile-comment-preview">💬 ${mark(spMerchantCommentPreview(m))}</span><span class="merchant-mobile-comment-more">${state.lang==='tj'?'Кушодан':'Открыть'}</span></button>`:''}${spMerchantRowActions(m,true)}</article>`).join('')}</div>`;
    const headers=`${sortableHeader(t('merchant'),'merchant',compact)}<th>${t('inn')}</th>${sortableHeader(t('city'),'city',compact)}<th>${t('contacts')}</th>${sortableHeader(t('manager'),'manager',compact)}${canAccessPartners()?`<th>${state.lang==='tj'?'Шарик':'Партнер'}</th>`:''}<th>${t('product')}</th>${sortableHeader(t('status'),'status',compact)}${sortableHeader(t('priority'),'priority',compact)}${sortableHeader(t('contract'),'contract',compact)}<th>${t('comments')}</th><th>${t('actions')}</th>`;
    return `${mobileCards}<div class="table-wrap merchant-table-wrap"><table><thead><tr>${headers}</tr></thead><tbody>${list.map(m=>`<tr class="${rowPriorityClass(m.priority)}"><td><div class="merchant-name-wrap">${merchantLogo(m,'mini')}<div class="merchant-name-main"><button class="linklike js-view-merchant merchant-name-hover" data-id="${esc(m.id)}" data-merchant-full-name="${esc(m.merchant||'')}" aria-label="${esc(m.merchant||'')}"><b>${mark(m.merchant)}</b></button><br><small>${mark(m.businessType||'')}</small></div></div></td><td>${mark(m.inn)}</td><td>${mark(m.city)}</td><td>${contactCell(m)}</td><td class="manager">${mark(m.manager)}</td>${canAccessPartners()?`<td>${m.partnerName?`<button class="linklike" onclick="setView('partners');setTimeout(()=>openPartnerViewModal('${esc(m.partnerId||'')}'),50)">${mark(m.partnerName)}</button>`:'—'}</td>`:''}<td><button type="button" class="linklike truncate js-open-text merchant-text-hover" data-label="product" data-title="${esc(m.merchant||'')}" data-text="${esc(m.product||'')}" data-smart-tooltip="${esc(m.product||'')}" aria-label="${esc(m.product||'Открыть полный текст продукта')}">${mark(m.product||'')}</button></td><td>${spSectionChip(m)}<br><span class="status ${statusClass(m.status)}">${esc(tr(m.status||''))}</span>${spMerchantSectionOf(m)==='main'?`<br>${inactivityBadgeHtml(m)}`:''}</td><td class="${priorityClass(m.priority)}">${esc(tr(m.priority||''))}</td><td>${contractCell(m)}</td><td><button type="button" class="linklike truncate js-open-text merchant-text-hover" data-label="comment-modal" data-title="${esc(m.merchant||'')}" data-text="${esc(spMerchantCommentText(m)||'')}" data-smart-tooltip="${esc(spMerchantCommentText(m)||'')}" aria-label="${esc(spMerchantCommentPreview(m)||'Открыть полный текст комментария')}">${mark(spMerchantCommentPreview(m))}</button></td><td>${spMerchantRowActions(m,false)}</td></tr>`).join('')}</tbody></table></div>`;
  };

  window.renderMerchants=function(isProblem=false){
    const list=sortMerchants(getFilteredMerchants()),section=state.merchantSection||'main';
    const title=isProblem?t('problems'):spSectionLabel(section);
    const total=spMerchantsBySection(section).length;
    let actions='';
    const excelButton=`<button class="btn merchant-excel-btn" type="button" onclick="openMerchantExcelExportModal()" title="Экспортировать отображаемых мерчантов в Excel"><span class="merchant-excel-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M14 2H6a2 2 0 0 0-2 2v3h2V4h8v5h5v11H6v-3H4v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6Zm1 1.5L18.5 7H15V3.5Z"/><path fill="currentColor" d="M2 9h9v7H2V9Zm2.1 1.2 1.35 2.1-1.45 2.5h1.55l.75-1.45.78 1.45h1.58l-1.48-2.52 1.34-2.08H7.02l-.66 1.26-.7-1.26H4.1Z"/></svg></span><span>${state.lang==='tj'?'Экспорт ба Excel':'Экспорт в Excel'}</span></button>`;
    if(section==='archive')actions=excelButton;
    else actions=`${excelButton}<button class="btn ghost" onclick="openBulkMerchantModal()">☑️ Массовое действие</button><button class="btn primary" onclick="openMerchantModal()">${section==='potential'?(state.lang==='tj'?'+ Иловаи лид':'+ Добавить потенциального'):t('addMerchant')}</button>`;
    qs('#viewRoot').innerHTML=`<section class="panel merchants-panel"><div class="panel-head"><div class="merchant-list-heading"><h3>${esc(title)}</h3><small>Показано ${list.length} из ${total} · ${esc(sortLabel())}</small></div><div class="actions">${actions}</div></div>${spMerchantSectionBanner()}<div style="padding:12px 18px 0">${merchantFilters()}</div><div id="merchantTableHost">${merchantTable(list)}</div></section>`;
  };

  try{if(window.CONFIG)CONFIG.APP_VERSION='v3.10.60-merchant-table-responsive'}catch(e){}
})();
</script>
<script>try{if(window.CONFIG)CONFIG.APP_VERSION='v3.10.67-merchant-text-modals';}catch(e){}</script>
</body>

  function buildNotifications(){

      if(isTaskOverdue(t)){

        notes.push({id:'task-active-'+id,kind:'task',cls:'task',icon:'✅',chip:'Задача',title:'Назначенная задача',text:'Мерчант: '+merchant+' · Задача: '+title,meta:['Срок: '+(fmt(due)||'без срока'),t.assignee?'Ответственный: '+t.assignee:''].filter(Boolean),date:parseDate(t.createdAt||t.updatedAt||due)||new Date(0),taskId:t.id,action:'task',prefKey:'taskAssigned',weight:6});
      }
    });
    (window.state&&Array.isArray(state.tasks)?state.tasks:[]).filter(function(t){return taskClosed(t)&&!taskDeleted(t)&&isMineTask(t);}).forEach(function(t){

    operationalMerchants().filter(isMineMerchant).forEach(function(m){

    var map={}; notes.forEach(function(n){if(!map[n.id])map[n.id]=n;});

  function persistMany(ids,status){
    ids=(ids||[]).map(String).filter(Boolean);
    if(!ids.length || typeof api!=='function' || !CONFIG.API_URL) return;
    try{
      api('saveNotificationReads',{notificationIds:ids,status:status||'read'}).then(function(res){
        if(res && res.notificationState) applyServerState(res.notificationState);
        refresh();
      }).catch(function(e){console.warn('Notification read sync skipped:',e);});
    }catch(e){console.warn('Notification read sync skipped:',e);}
  }
  function persistOne(id,status){ if(id) persistMany([id],status); }
  function applyServerState(ns){
    if(!ns) return false;
    ensureStateSets();
    var read=new Set(Array.isArray(ns.readIds)?ns.readIds.map(String):[]);
    var hidden=new Set(Array.isArray(ns.hiddenIds)?ns.hiddenIds.map(String):[]);
    hidden.forEach(function(id){read.add(id);});
    try{
      if(window.state){
        state.notificationReadIds=read;
        state.notificationHiddenIds=hidden;
        state.notificationServerInitialized=!!ns.initialized;
        state.notificationUserKey=String(ns.userKey||userScope());
      }
    }catch(e){}
    saveLocalSet('read',read); saveLocalSet('hidden',hidden);
    setTimeout(refresh,20);
    return true;
  }
  window.spNcApplyServerState=applyServerState;

  function currentNotes(){
    ensureStateSets();
    var notes=buildNotifications();
    try{
      var initKey=storageKey('initialized');
      var serverInitialized=!!(window.state && state.notificationServerInitialized);
      if(window.state && state._loadedFromApi && !serverInitialized && !localStorage.getItem(initKey)){
        var r=getSet('read'); notes.forEach(function(n){r.add(n.id);}); setKindSet('read',r); localStorage.setItem(initKey,'1');
        clearTimeout(spNcSaveTimer); spNcSaveTimer=setTimeout(function(){persistMany(notes.map(function(n){return n.id;}),'read');},250);
      }
    }catch(e){}
    var hidden=getSet('hidden');
    return notes.filter(function(n){return !hidden.has(n.id) && !isSnoozed(n.id);});
  }
  function unreadCount(notes){var read=getSet('read');return notes.filter(function(n){return !read.has(n.id);}).length;}
  function ensureUi(){
    var meta=document.querySelector('.top .meta');
    if(meta && !document.getElementById('spNotifyBtn')){
      var btn=document.createElement('button');
      btn.type='button';btn.id='spNotifyBtn';btn.className='btn help-btn sp-notify-btn';btn.title='Центр уведомлений';btn.setAttribute('aria-label','Центр уведомлений');

      var before=meta.querySelector('.settings-top-btn')||meta.querySelector('.help-btn')||meta.firstChild;
      meta.insertBefore(btn,before);
    }
    if(!document.getElementById('spNotifyMobileBtn')){
      var mbtn=document.createElement('button');
      mbtn.type='button';mbtn.id='spNotifyMobileBtn';mbtn.className='sp-notify-mobile-fab';mbtn.title='Центр уведомлений';mbtn.setAttribute('aria-label','Центр уведомлений');

  function filterNotes(notes){

    if(spNcFilter==='unread'){var read=getSet('read');return notes.filter(function(n){return !read.has(n.id);});}
    return notes;
  }

    },180);
  }
  function openSmartTask(id){
    var n=currentNotes().find(function(x){return x.id===String(id||'');}); if(!n)return;
    markRead(id); closePanel();
    try{if(typeof openTaskModal==='function')openTaskModal(n.merchantId);}catch(e){try{setView('tasks');setTimeout(function(){if(typeof openTaskModal==='function')openTaskModal(n.merchantId);},180);}catch(_){}}
  }
  document.addEventListener('click',function(e){
    var close=e.target.closest('[data-nc-close]');if(close){closePanel();return;}
    var filter=e.target.closest('[data-nc-filter]');if(filter){spNcFilter=filter.getAttribute('data-nc-filter')||'all';renderPanel();return;}
    var all=e.target.closest('[data-nc-mark-all]');if(all){markAllRead();return;}
    var op=e.target.closest('[data-nc-open]');if(op){openNote(op.getAttribute('data-nc-open'));return;}

  document.addEventListener('keydown',function(e){if(e.key==='Escape')closePanel();});
  window.spNcRefreshNotificationCenter=refresh;

  try{var oldRender=window.render;if(typeof oldRender==='function'&&!oldRender.__spNcWrapped){var wrapped=function(){var r=oldRender.apply(this,arguments);setTimeout(refresh,30);return r;};wrapped.__spNcWrapped=true;window.render=wrapped;}}
  catch(e){}
  try{var oldNotify=window.notifyAssignedTasks;if(typeof oldNotify==='function'&&!oldNotify.__spNcWrapped){var nwrap=function(){var r=oldNotify.apply(this,arguments);setTimeout(refresh,60);return r;};nwrap.__spNcWrapped=true;window.notifyAssignedTasks=nwrap;}}
  catch(e){}

  setTimeout(refresh,200);setTimeout(refresh,1200);setInterval(refresh,20000);
})();

<script id="sp-task-kanban-v31046-js">
(function(){
  if(window.__spTaskKanbanV31046)return; window.__spTaskKanbanV31046=true;
  try{ if(window.CONFIG) CONFIG.APP_VERSION='v3.10.50-compact-task-cards'; }catch(e){}
  function h(v){try{return typeof esc==='function'?esc(v):String(v??'').replace(/[&<>"']/g,function(s){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s];});}catch(e){return String(v||'');}}
  function txt(ru,tj){try{return (state&&state.lang)==='tj'?tj:ru;}catch(e){return ru;}}
  function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ');}
  function uid(t){return String((t&&t.id)||'').trim() || ('T'+String((t&&t.createdAt)||'')+String((t&&t.title)||''));}
  function statusOf(t){try{return typeof normalizeTaskStatus==='function'?normalizeTaskStatus(t&&t.status):String((t&&t.status)||'');}catch(e){return String((t&&t.status)||'');}}
  function canDragTask(t){try{return typeof canChangeTaskStatus==='function'?canChangeTaskStatus(t):(typeof canManageTask==='function'?canManageTask(t):true);}catch(e){return true;}}
  function isClosedTask(t){try{return typeof taskIsClosed==='function'?taskIsClosed(t):false;}catch(e){return norm(t&&t.status).includes('закры')||norm(t&&t.status).includes('выполн');}}
  function overdueTask(t){try{return typeof isOverdue==='function'?isOverdue(t&&t.dueDate):false;}catch(e){return false;}}
  function columnOf(t){
    if(isClosedTask(t)) return 'done';
    if(overdueTask(t)) return 'overdue';
    var s=norm(statusOf(t));
    if(s.includes('работ')||s.includes('раванд')||s.includes('work')||s.includes('progress')) return 'work';
    return 'new';
  }
  function getMode(){
    try{ if(!state.taskViewMode) state.taskViewMode=localStorage.getItem('sp_task_view_mode')||'table'; return state.taskViewMode==='kanban'?'kanban':'table'; }catch(e){return 'table';}
  }
  window.setTaskViewMode=function(mode){
    try{state.taskViewMode=mode==='kanban'?'kanban':'table';localStorage.setItem('sp_task_view_mode',state.taskViewMode);}catch(e){}
    try{renderTasks();}catch(e){}
  };
  function viewSwitch(){
    var mode=getMode();
    return '<div class="sp-task-view-switch" role="group" aria-label="Вид задач"><button type="button" class="sp-task-view-btn '+(mode==='table'?'active':'')+'" onclick="setTaskViewMode(\'table\')">☰ Таблица</button><button type="button" class="sp-task-view-btn '+(mode==='kanban'?'active':'')+'" onclick="setTaskViewMode(\'kanban\')">▦ Kanban</button></div>';
  }
  function filteredTaskListForKanban(){
    var base=[];try{base=(typeof visibleTasks==='function'?visibleTasks():(state.tasks||[]))||[];}catch(e){base=[];}
    var q='';try{q=String(state.taskQuickFilter||'');}catch(e){}
    if(q){base=base.filter(function(x){try{return taskDueBucket(x)===q;}catch(e){return true;}});}
    return base;
  }
  function tableTaskList(){
    var base=[];try{base=(typeof visibleTasks==='function'?visibleTasks():(state.tasks||[]))||[];}catch(e){base=[];}
    var active=base.filter(function(x){return !isClosedTask(x);});
    var archive=base.filter(isClosedTask);
    try{ if(!state.taskTab) state.taskTab='active'; }catch(e){}
    var list=(state.taskTab==='archive')?archive:active;
    try{ if(state.filterText==='overdue') list=list.filter(function(x){return !isClosedTask(x)&&overdueTask(x);}); }catch(e){}
    try{ if(state.taskTab==='archive' && state.taskTodayFilter==='closed') list=list.filter(function(x){return isTodayValue(x.completedAt||x.updatedAt);}); }catch(e){}
    try{ if(state.taskTab!=='archive' && state.taskQuickFilter) list=list.filter(function(x){return taskDueBucket(x)===state.taskQuickFilter;}); }catch(e){}
    return {base:base,active:active,archive:archive,list:list};
  }
  function topTabs(active,archive){
    return '<div class="tabs nice-tabs"><button class="tab-btn '+(state.taskTab==='active'?'active':'')+'" onclick="state.taskTab=\'active\';state.taskTodayFilter=\'\';renderTasks()">✅ '+h(t('activeTasks'))+' ('+active.length+')</button><button class="tab-btn '+(state.taskTab==='archive'?'active':'')+'" onclick="state.taskTab=\'archive\';state.taskTodayFilter=\'\';renderTasks()">📦 '+h(t('archiveTasks'))+' ('+archive.length+')</button></div>';
  }
  function renderTaskCard(x){
    var id=uid(x), col=columnOf(x), locked=!canDragTask(x);
    var title=String((x&&x.title)||'').trim()||txt('Без названия','Бе ном');
    var merchant=String((x&&x.merchant)||'').trim();
    var assignee=String((x&&x.assignee)||'').trim();
    var pr=String((x&&x.priority)||'').trim();
    var prCls='';try{prCls=priorityClass(pr)||'';}catch(e){}
    var dueRaw=String((x&&x.dueDate)||'').trim();
    var due=dueRaw?fmtDate(dueRaw):'';
    var dueCls=overdueTask(x)&&!isClosedTask(x)?' overdue':'';
    var desc=String((x&&x.description)||'').trim();
    var creator='';
    try{creator=String(taskCreatorName(x)||'').trim();}catch(e){creator=String((x&&x.createdByName)||'').trim();}
    if(/^(не указано|неизвестно|пользователь)$/i.test(creator)) creator='';
    var actions='';
    if(!locked){
      if(col==='new'){
        actions+='<button type="button" class="sp-kanban-mini-btn" data-kanban-move="work" data-task-id="'+h(id)+'">▶ В работу</button>';
        actions+='<button type="button" class="sp-kanban-mini-btn done" data-kanban-move="done" data-task-id="'+h(id)+'">✓ Выполнить</button>';
      }else if(col==='work' || col==='overdue'){
        actions+='<button type="button" class="sp-kanban-mini-btn done wide" data-kanban-move="done" data-task-id="'+h(id)+'">✓ Выполнить</button>';
      }
    }
    var chips='';
    if(assignee) chips+='<span class="sp-kanban-chip">👤 '+h(tr(assignee))+'</span>';
    if(due) chips+='<span class="sp-kanban-chip due'+dueCls+'">📅 '+h(due)+'</span>';
    if(pr) chips+='<span class="sp-kanban-chip '+h(prCls)+'">⚡ '+h(tr(pr))+'</span>';
    var secondary='';
    if(merchant) secondary+='<span class="sp-kanban-card-merchant">🏪 '+h(merchant)+'</span>';
    if(creator) secondary+='<span class="sp-kanban-card-creator">Создал: '+h(creator)+'</span>';
    return '<article class="sp-kanban-card '+(locked?'locked':'')+' col-'+h(col)+'" data-task-id="'+h(id)+'" draggable="'+(!locked)+'" title="'+h(t('openTaskCard'))+'">'+
      '<div class="sp-kanban-card-top"><div class="sp-kanban-card-title">'+h(tr(title))+'</div>'+(locked?'<span class="sp-kanban-readonly">👁 Только просмотр</span>':'')+'</div>'+ 
      (secondary?'<div class="sp-kanban-card-secondary">'+secondary+'</div>':'')+
      (chips?'<div class="sp-kanban-card-meta">'+chips+'</div>':'')+
      (desc?'<div class="sp-kanban-card-desc">'+h(tr(desc))+'</div>':'')+
      (actions?'<div class="sp-kanban-card-actions">'+actions+'</div>':'')+
    '</article>';
  }

  function kanbanHtml(){
    var list=filteredTaskListForKanban();
    var columns=[
      ['new','🆕',txt('Новые','Нав'),txt('Новые задачи без просрочки','Вазифаҳои нав')],
      ['work','🔧',txt('В работе','Дар кор'),txt('Задачи, которые выполняются','Вазифаҳои иҷрошаванда')],
      ['overdue','⚠️',txt('Просроченные','Дермонда'),txt('Срок уже прошёл','Муҳлат гузаштааст')],
      ['done','✅',txt('Выполненные','Иҷрошуда'),txt('Закрытые задачи','Вазифаҳои пӯшида')]
    ];
    var groups={new:[],work:[],overdue:[],done:[]};
    list.forEach(function(x){groups[columnOf(x)].push(x);});
    var body=columns.map(function(c){
      var arr=groups[c[0]]||[];
      var cards=arr.length?arr.map(renderTaskCard).join(''):'<div class="sp-kanban-empty">'+h(txt('Пока пусто','Ҳоло холӣ'))+'</div>';
      return '<section class="sp-kanban-col" data-col="'+c[0]+'"><div class="sp-kanban-col-head"><div><div class="sp-kanban-col-title"><span>'+c[1]+'</span>'+h(c[2])+'</div><div class="muted-small">'+h(c[3])+'</div></div><b class="sp-kanban-count">'+arr.length+'</b></div><div class="sp-kanban-dropzone" data-kanban-col="'+c[0]+'">'+cards+'</div></section>';
    }).join('');
    return '<div style="padding:0 16px 12px">'+(typeof taskQuickFiltersHtml==='function'?taskQuickFiltersHtml():'')+'</div><div class="sp-task-kanban-wrap"><div class="sp-task-kanban-note"><span>💡 '+h(txt('Перетащите карточку между колонками или используйте быстрые кнопки на карточке. Просроченные задачи определяются автоматически по дедлайну.','Кортро байни сутунҳо кашед ё тугмаҳои зудро истифода баред.'))+'</span><span>'+h(txt('Мобильная версия: листайте колонки влево/вправо.','Дар мобилӣ сутунҳоро ба чап/рост гузаронед.'))+'</span></div><div class="sp-task-kanban">'+body+'</div></div>';
  }
  function renderTableMode(){
    var data=tableTaskList();
    var panelTitle=(state.taskTab==='archive'&&state.taskTodayFilter==='closed')?t('completedTasksToday'):t('tasks');
    var table='';try{table=taskTable(data.list);}catch(e){table='<div class="empty">Ошибка таблицы задач</div>';}
    return '<section class="panel"><div class="panel-head"><h3>'+h(panelTitle)+'</h3><div class="sp-task-head-actions">'+viewSwitch()+'<button class="btn primary" onclick="openTaskModal()">'+h(t('addTask'))+'</button></div></div>'+topTabs(data.active,data.archive)+'<div style="padding:0 16px 12px">'+(state.taskTab==='active'&&typeof taskQuickFiltersHtml==='function'?taskQuickFiltersHtml():'')+'</div>'+table+'</section>';
  }
  function renderKanbanMode(){
    return '<section class="panel"><div class="panel-head"><div><h3>'+h(t('tasks'))+' · Kanban</h3><div class="chart-note">'+h(txt('Новые → В работе → Просроченные → Выполненные','Нав → Дар кор → Дермонда → Иҷрошуда'))+'</div></div><div class="sp-task-head-actions">'+viewSwitch()+'<button class="btn primary" onclick="openTaskModal()">'+h(t('addTask'))+'</button></div></div>'+kanbanHtml()+'</section>';
  }
  function spRenderTasks(){
    try{ if(!state.taskTab) state.taskTab='active'; }catch(e){}
    var root=document.getElementById('viewRoot')|| (typeof qs==='function'?qs('#viewRoot'):null); if(!root)return;
    root.innerHTML=getMode()==='kanban'?renderKanbanMode():renderTableMode();
  }
  async function moveTask(id,target){
    var task=null;try{task=(state.tasks||[]).find(function(x){return uid(x)===String(id);});}catch(e){}
    if(!task){try{toast('Задача не найдена');}catch(e){}return;}
    if(!canDragTask(task)){try{toast('Перемещать задачу может автор, назначенный исполнитель или руководство');}catch(e){}return;}
    if(target==='overdue' && !overdueTask(task) && !isClosedTask(task)){try{toast('Просроченные формируются автоматически по дедлайну');}catch(e){}return;}
    var oldCol=columnOf(task), obj=Object.assign({},task);
    if(target==='new'){obj.status='Открыта';obj.completedAt='';}
    else if(target==='work'){obj.status='В работе';obj.completedAt='';}
    else if(target==='done'){obj.status='Закрыта';obj.completedAt=obj.completedAt||new Date().toISOString();}
    else if(target==='overdue'){obj.status='В работе';obj.completedAt='';}
    else return;
    obj.updatedAt=new Date().toISOString();
    try{var u=currentUser&&currentUser();obj.createdByLogin=obj.createdByLogin||obj.creatorLogin||taskCreatorLogin(task)||u?.login||'';obj.createdByName=obj.createdByName||obj.creatorName||taskCreatorName(task)||u?.fio||u?.login||'';obj.user=(u?.fio||u?.login||'Пользователь');}catch(e){}
    Object.assign(task,obj);
    try{renderTasks();updateTaskBadge&&updateTaskBadge();}catch(e){}
    try{ if(window.CONFIG&&CONFIG.API_URL){ await api('saveTask',{task:obj}); await loadData(); } if(oldCol!==target) toast('Статус задачи обновлён'); }
    catch(e){console.error(e);try{toast('Ошибка перемещения задачи: '+(e.message||e));await loadData();}catch(_){} }
  }
  window.spKanbanMoveTask=moveTask;
  document.addEventListener('dragstart',function(e){var card=e.target.closest&&e.target.closest('.sp-kanban-card[draggable="true"]');if(!card)return;try{e.dataTransfer.setData('text/plain',card.getAttribute('data-task-id')||'');e.dataTransfer.effectAllowed='move';}catch(_){}card.classList.add('dragging');});
  document.addEventListener('dragend',function(e){var card=e.target.closest&&e.target.closest('.sp-kanban-card');if(card)card.classList.remove('dragging');document.querySelectorAll('.sp-kanban-dropzone.is-over').forEach(function(x){x.classList.remove('is-over');});});
  document.addEventListener('dragover',function(e){var dz=e.target.closest&&e.target.closest('.sp-kanban-dropzone');if(!dz)return;e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(_){}dz.classList.add('is-over');});
  document.addEventListener('dragleave',function(e){var dz=e.target.closest&&e.target.closest('.sp-kanban-dropzone');if(dz&&!dz.contains(e.relatedTarget))dz.classList.remove('is-over');});
  document.addEventListener('drop',function(e){var dz=e.target.closest&&e.target.closest('.sp-kanban-dropzone');if(!dz)return;e.preventDefault();var id='';try{id=e.dataTransfer.getData('text/plain');}catch(_){}dz.classList.remove('is-over');var col=dz.getAttribute('data-kanban-col')||'';if(id&&col)moveTask(id,col);});
  document.addEventListener('click',function(e){
    var mv=e.target.closest&&e.target.closest('[data-kanban-move]');if(mv){e.preventDefault();e.stopPropagation();moveTask(mv.getAttribute('data-task-id'),mv.getAttribute('data-kanban-move'));return;}
    var card=e.target.closest&&e.target.closest('.sp-kanban-card');if(card&&!e.target.closest('.sp-kanban-card-actions')){var id=card.getAttribute('data-task-id');if(id&&typeof openTaskViewModal==='function')openTaskViewModal(id);}
  });
  try{window.renderTasks=spRenderTasks;renderTasks=spRenderTasks;}catch(e){window.renderTasks=spRenderTasks;}

<script id="sp-login-redesign-v31052-script">
(function(){
  window.spToggleLoginPassword=function(button){
    var input=document.getElementById('loginPassword');
    if(!input)return;
    var visible=input.type==='text';
    input.type=visible?'password':'text';
    if(button){
      button.classList.toggle('is-visible',!visible);
      button.setAttribute('aria-label',visible?'Показать пароль':'Скрыть пароль');
      button.setAttribute('title',visible?'Показать пароль':'Скрыть пароль');
    }
    try{input.focus({preventScroll:true});}catch(e){input.focus();}
  };
  window.spLoginSubmit=function(button){
    if(!button||button.classList.contains('is-loading'))return;
    var text=button.querySelector('.sp-login-submit-text');
    button.classList.add('is-loading');
    button.disabled=true;
    if(text)text.textContent='Входим…';
    setTimeout(function(){
      try{if(typeof doLogin==='function')doLogin();}
      finally{
        setTimeout(function(){
          var screen=document.getElementById('loginScreen');
          if(screen&&screen.classList.contains('show')){
            button.classList.remove('is-loading');
            button.disabled=false;
            if(text)text.textContent='Войти';
          }
        },450);
      }
    },60);
  };
  function resetLoginButton(){
    var button=document.getElementById('spLoginSubmit');
    if(!button)return;
    button.classList.remove('is-loading');
    button.disabled=false;
    var text=button.querySelector('.sp-login-submit-text');
    if(text)text.textContent='Войти';
  }
  function initLoginUi(){
    var screen=document.getElementById('loginScreen');
    if(screen)screen.classList.add('sp-login-ready');
    var login=document.getElementById('loginEmail');
    if(login&&!login.value&&screen&&screen.classList.contains('show')){
      setTimeout(function(){try{login.focus({preventScroll:true});}catch(e){}},120);
    }
    resetLoginButton();
  }
  document.addEventListener('DOMContentLoaded',initLoginUi);
  setTimeout(initLoginUi,80);
  try{if(window.CONFIG)CONFIG.APP_VERSION='v3.10.58-excel-optional-rate';}catch(e){}
})();
</script>

<script id="sp-merchant-name-tooltip-v31062-script">
(function(){
  'use strict';
  let tooltip=null;
  let activeTarget=null;

  function ensureTooltip(){
    if(tooltip&&document.body.contains(tooltip)) return tooltip;
    tooltip=document.createElement('div');
    tooltip.className='sp-merchant-name-tooltip';
    tooltip.setAttribute('role','tooltip');
    document.body.appendChild(tooltip);
    return tooltip;
  }

  function placeTooltip(target){
    const tip=ensureTooltip();
    const rect=target.getBoundingClientRect();
    tip.style.display='block';
    const tipRect=tip.getBoundingClientRect();
    const margin=10;
    let left=rect.left;
    let top=rect.top-tipRect.height-margin;
    if(top<margin) top=rect.bottom+margin;
    left=Math.max(margin,Math.min(left,window.innerWidth-tipRect.width-margin));
    top=Math.max(margin,Math.min(top,window.innerHeight-tipRect.height-margin));
    tip.style.left=Math.round(left)+'px';
    tip.style.top=Math.round(top)+'px';
  }

  function showTooltip(target){
    const name=String(target?.dataset?.smartTooltip||target?.dataset?.merchantFullName||'').trim();
    if(!name) return;
    activeTarget=target;
    const tip=ensureTooltip();
    tip.textContent=name;
    placeTooltip(target);
    requestAnimationFrame(()=>tip.classList.add('show'));
  }

  function hideTooltip(target){
    if(target&&activeTarget&&target!==activeTarget) return;
    activeTarget=null;
    if(!tooltip) return;
    tooltip.classList.remove('show');
    setTimeout(()=>{if(tooltip&&!tooltip.classList.contains('show'))tooltip.style.display='none';},130);
  }

  document.addEventListener('mouseover',function(e){
    const target=e.target.closest&&e.target.closest('.merchant-name-hover[data-merchant-full-name],.merchant-text-hover[data-smart-tooltip]');
    if(!target||target===activeTarget) return;
    showTooltip(target);
  });
  document.addEventListener('mouseout',function(e){
    const target=e.target.closest&&e.target.closest('.merchant-name-hover[data-merchant-full-name],.merchant-text-hover[data-smart-tooltip]');
    if(!target) return;
    if(e.relatedTarget&&target.contains(e.relatedTarget)) return;
    hideTooltip(target);
  });
  document.addEventListener('focusin',function(e){
    const target=e.target.closest&&e.target.closest('.merchant-name-hover[data-merchant-full-name],.merchant-text-hover[data-smart-tooltip]');
    if(target) showTooltip(target);
  });
  document.addEventListener('focusout',function(e){
    const target=e.target.closest&&e.target.closest('.merchant-name-hover[data-merchant-full-name],.merchant-text-hover[data-smart-tooltip]');
    if(target) hideTooltip(target);
  });
  document.addEventListener('scroll',()=>hideTooltip(),true);
  window.addEventListener('resize',()=>hideTooltip());
  try{if(window.CONFIG)CONFIG.APP_VERSION='v3.10.67-merchant-text-modals';}catch(e){}
})();
</script>

<script id="sp-merchant-browser-notifications-v31063-script">
(function(){
  'use strict';
  if(window.__spMerchantBrowserNotificationsV31063) return;
  window.__spMerchantBrowserNotificationsV31063=true;

  function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}
  function escHtml(v){return String(v??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function current(){try{return typeof currentUser==='function'?currentUser():null}catch(e){return null}}
  function userScope(){var u=current()||{};return norm(u.login||u.fio||u.name||'guest').replace(/[^a-z0-9а-яё_-]+/gi,'_')||'guest'}
  function snapshotKey(){return 'sp_merchant_notify_snapshot_v31063_'+userScope()}
  function seenKey(){return 'sp_merchant_notify_seen_v31063_'+userScope()}
  function promptKey(){return 'sp_merchant_notify_prompt_v31063_'+userScope()}
  function merchantKey(m){return String(m&& (m.id||m.inn||m.merchant)||'').trim()}
  function managerMatches(m){
    try{if(typeof canAccessPartners==='function'&&canAccessPartners())return true}catch(e){}
    try{if(typeof isMainAdmin==='function'&&isMainAdmin())return true}catch(e){}
    var u=current()||{}, value=norm(m&&m.manager); if(!value)return false;
    if(['все','all','ҳама','команда','team'].includes(value))return true;
    return [u.login,u.fio,u.name,u.username].map(norm).filter(Boolean).some(function(k){return value===k || (value.length>2&&k.indexOf(value)>=0) || (k.length>2&&value.indexOf(k)>=0)})
  }
  function snapshotOf(list){
    var out={};
    (Array.isArray(list)?list:[]).forEach(function(m){
      var key=merchantKey(m); if(!key)return;
      out[key]={id:String(m.id||''),name:String(m.merchant||'Мерчант'),status:String(m.status||''),manager:String(m.manager||''),updatedAt:String(m.updatedAt||''),section:String(m.merchantSection||m.section||'')};
    });
    return out;
  }
  function readJson(key,fallback){try{var x=JSON.parse(localStorage.getItem(key)||'');return x&&typeof x==='object'?x:fallback}catch(e){return fallback}}
  function saveJson(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){}}
  function seenSet(){var a=readJson(seenKey(),[]);return new Set(Array.isArray(a)?a.map(String):[])}
  function saveSeen(set){saveJson(seenKey(),Array.from(set).slice(-800))}
  function statusText(v){return String(v||'Не указано').trim()||'Не указано'}

  function openMerchant(id){
    try{window.focus()}catch(e){}
    try{if(typeof setView==='function')setView('merchants',{section:'main'})}catch(e){}
    if(!id)return;
    setTimeout(function(){
      try{
        if(typeof openMerchantViewDrawer==='function')openMerchantViewDrawer(id);
        else if(typeof openMerchantViewModal==='function')openMerchantViewModal(id);
      }catch(e){}
